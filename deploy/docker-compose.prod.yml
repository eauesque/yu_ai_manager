# YU AI Manager -- Production Docker Compose configuration
# Usage: docker compose -f deploy/docker-compose.prod.yml up -d
#
# Environment variables can be set via .env file or shell
# (see deploy/.env.example)

services:
  # ---- Flask application ----
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    volumes:
      - ../data:/app/data
      - ../config.json:/app/config.json:ro
    environment:
      - PYTHONUNBUFFERED=1
    expose:
      - "5000"
    restart: unless-stopped

  # ---- Nginx reverse proxy ----
  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      # nginx:alpine template mechanism: expands /etc/nginx/templates/*.template
      # via envsubst and outputs to /etc/nginx/conf.d/
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ../static:/app/static:ro
    environment:
      - UPSTREAM_HOST=app
      - UPSTREAM_PORT=5000
    depends_on:
      - app
    restart: unless-stopped
