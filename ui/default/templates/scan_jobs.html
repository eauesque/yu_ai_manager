<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YU AI Manager - スキャン履歴</title>
  <link rel="stylesheet" href="static/css/main.css?v=20260213">
  <link rel="stylesheet" href="static/css/dark-mode/fix/dark-mode-fix-v2.css?v=20260225">
  <link rel="stylesheet" href="static/css/pages/scan-jobs.css?v=20260418b">
  <!-- Atelier System (γ): tokens → components → editorial -->
  <link rel="stylesheet" href="static/css/atelier/atelier-tokens.css?v=20260507">
  <link rel="stylesheet" href="static/css/atelier/atelier-components.css?v=20260507">
  <link rel="stylesheet" href="static/css/atelier/atelier-index.css?v=20260507">
</head>
<body data-1p-ignore data-lpignore="true">
  {% include "_nav.html" %}
  <main id="main-content" class="container" style="padding-top:60px;">
    <header class="scan-jobs-header">
      <h1>📋 <span data-i18n="scan_jobs.title">スキャン履歴</span></h1>
      <div class="scan-jobs-header-actions">
        <label class="sj-auto-refresh-label">
          <input type="checkbox" id="sjAutoRefresh" checked>
          <span data-i18n="scan_jobs.auto_refresh">自動更新 (5秒)</span>
        </label>
        <button type="button" class="sj-btn" id="sjRefreshBtn" data-i18n="scan_jobs.refresh">更新</button>
        <button type="button" class="sj-btn danger" id="sjClearHistoryBtn" data-i18n="scan_jobs.clear_history">履歴をクリア</button>
      </div>
    </header>

    <!-- Active jobs section -->
    <section class="sj-section" id="sjActiveSection">
      <h2 data-i18n="scan_jobs.active_jobs">実行中のジョブ</h2>
      <div id="sjActiveJobs" class="sj-jobs-list">
        <div class="sj-empty" data-i18n="scan_jobs.no_active_jobs">実行中のジョブはありません</div>
      </div>
    </section>

    <!-- History section -->
    <section class="sj-section">
      <h2 data-i18n="scan_jobs.history">スキャン履歴</h2>
      <div class="sj-table-wrap">
        <table class="sj-table" id="sjHistoryTable">
          <thead>
            <tr>
              <th data-i18n="scan_jobs.col_time">日時</th>
              <th data-i18n="scan_jobs.col_label">ラベル</th>
              <th data-i18n="scan_jobs.col_status">状態</th>
              <th class="num" data-i18n="scan_jobs.col_added">追加</th>
              <th class="num" data-i18n="scan_jobs.col_updated">更新</th>
              <th class="num" data-i18n="scan_jobs.col_deleted">削除</th>
              <th class="num" data-i18n="scan_jobs.col_errors">エラー</th>
              <th class="num" data-i18n="scan_jobs.col_elapsed">処理時間</th>
            </tr>
          </thead>
          <tbody id="sjHistoryBody">
            <tr><td colspan="8" class="sj-empty" data-i18n="scan_jobs.loading">読み込み中...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script nonce="{{ csp_nonce }}" type="module" src="/static/dist/scan-jobs-app.js?v={{ dist_v }}"></script>
</body>
</html>
