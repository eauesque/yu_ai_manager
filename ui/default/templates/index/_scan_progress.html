  <!-- Scan Progress Bar -->
  <div id="scanProgressBar" class="scan-progress-bar">
    <div class="scan-progress-content">
      <div class="scan-progress-icon">⟳</div>
      <div class="scan-progress-info">
        <div class="scan-progress-text" id="scanProgressText">Scanning...</div>
        <div class="scan-progress-details" id="scanProgressDetails">0 / 0 files</div>
      </div>
      <div class="scan-progress-track">
        <div class="scan-progress-fill" id="scanProgressFill" style="width: 0%"></div>
      </div>
      <div class="scan-progress-percent" id="scanProgressPercent">0%</div>
      <button class="scan-progress-close" data-action="runtimeInitApi.hideScanProgress" data-i18n="search.dismiss">Dismiss</button>
    </div>
  </div>
