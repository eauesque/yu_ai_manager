<!-- Floating grid controller -->
<div id="floatingGridCtrl" class="fgc" style="display:none;">
  <button type="button" id="fgcToggle" class="fgc-toggle" title="Grid Controls" data-i18n-title="grid.controls_title"><svg class="icon" aria-hidden="true"><use href="/static/img/icons/icons.svg#icon-settings"/></svg></button>
  <div id="fgcBody" class="fgc-body" style="display:none;">
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
      <span style="font-size:11px;color:var(--muted,#aab2c0);min-width:58px;" data-i18n="grid.size">サイズ</span>
      <input type="range" id="gridSizeSlider" min="120" max="500" value="300" step="10" aria-label="Grid size" style="flex:1;accent-color:#667eea;height:4px;cursor:pointer;" />
      <span id="gridSizeVal" style="font-size:10px;color:#667eea;min-width:32px;text-align:right;">300</span>
    </div>
    <div style="display:flex;align-items:center;gap:6px;">
      <span style="font-size:11px;color:var(--muted,#aab2c0);min-width:58px;" data-i18n="grid.columns">カラム</span>
      <input type="range" id="gridColSlider" min="0" max="12" value="0" step="1" aria-label="Grid columns" style="flex:1;accent-color:#667eea;height:4px;cursor:pointer;" />
      <span id="gridColVal" style="font-size:10px;color:#667eea;min-width:32px;text-align:right;" data-i18n="grid.auto">自動</span>
    </div>
    <div id="gridLiveInfo" style="margin-top:6px;font-size:10px;color:#9aa;line-height:1.3;"></div>
  </div>
</div>
