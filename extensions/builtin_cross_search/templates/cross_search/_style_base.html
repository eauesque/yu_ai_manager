<style>
/* ── Layout (uses core theme variables) ────────────── */
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
}
.cxs-layout {
  display: flex;
  height: calc(100vh - var(--nav-h, 50px));
  margin-top: var(--nav-h, 50px);
}

/* ── Sidebar ────────────────────────────────────────── */
.cxs-sidebar {
  width: 380px;
  min-width: 300px;
  max-width: 460px;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  background: var(--card);
  overflow: hidden;
}
.cxs-sidebar-header {
  padding: 12px;
  border-bottom: 1px solid var(--border);
}
.cxs-search-input {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-input);
  color: var(--text);
  font-size: 15px;
  box-sizing: border-box;
}
.cxs-search-input::placeholder {
  color: var(--muted);
}
.cxs-search-input:focus {
  outline: 2px solid var(--accent);
  outline-offset: -1px;
}
.cxs-target-row {
  display: flex;
  gap: 10px;
  margin-top: 8px;
  flex-wrap: wrap;
}
.cxs-target-chk {
  font-size: 13px;
  color: var(--muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
}
.cxs-target-chk input { margin: 0; min-width: 24px; min-height: 24px; }
.cxs-sidebar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  border-bottom: 1px solid var(--border);
}
.cxs-btn {
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  font-size: 13px;
  transition: background 0.15s;
}
.cxs-btn:hover { background: var(--bg-hover); }
.cxs-btn-sm { padding: 4px 10px; font-size: 12px; }
.cxs-result-count {
  font-size: 12px;
  color: var(--muted);
  margin-left: auto;
}

/* ── Scan roots management ───────────────────────────── */
.cxs-roots-section {
  border-bottom: 1px solid var(--border);
}
.cxs-roots-header {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  cursor: pointer;
  font-size: 13px;
  color: var(--muted);
  user-select: none;
  transition: background 0.15s;
}
.cxs-roots-header:hover {
  background: var(--bg-hover);
}
.cxs-roots-arrow {
  font-size: 10px;
  transition: transform 0.2s;
  display: inline-block;
}
.cxs-roots-arrow.open {
  transform: rotate(90deg);
}
.cxs-roots-count {
  margin-left: auto;
  background: var(--bg);
  padding: 1px 7px;
  border-radius: 10px;
  font-size: 11px;
}
.cxs-roots-body {
  padding: 0 12px 8px;
}
.cxs-roots-list {
  max-height: 160px;
  overflow-y: auto;
  margin-bottom: 6px;
}
.cxs-roots-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 0;
  font-size: 12px;
  border-bottom: 1px solid var(--border);
}
.cxs-roots-item-path {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text);
}
.cxs-roots-item-icon {
  font-size: 11px;
  flex-shrink: 0;
}
.cxs-roots-item-icon.ok { color: var(--success); }
.cxs-roots-item-icon.ng { color: var(--error); }
.cxs-roots-item-del {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 16px;
  padding: 4px 8px;
  min-width: 28px;
  min-height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 4px;
  line-height: 1;
  flex-shrink: 0;
  transition: background 0.15s, color 0.15s;
}
.cxs-roots-item-del:hover {
  color: var(--error);
  background: rgba(244,67,54,0.1);
}
.cxs-roots-item-del:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
.cxs-roots-actions {
  display: flex;
  gap: 6px;
  margin-bottom: 4px;
}
.cxs-roots-input-row {
  display: flex;
  gap: 4px;
  margin-top: 4px;
}
.cxs-roots-input {
  flex: 1;
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--bg-input);
  color: var(--text);
  font-size: 12px;
  min-width: 0;
}
.cxs-roots-fallback {
  font-size: 11px;
  color: var(--muted);
  padding: 4px 0;
  font-style: italic;
}
.cxs-btn-primary {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.cxs-btn-primary:hover { opacity: 0.9; }

/* ── Scan bar ───────────────────────────────────────── */
.cxs-scan-bar {
  padding: 6px 12px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  color: var(--muted);
  display: none;
}
.cxs-scan-bar.active { display: block; }
.cxs-scan-progress {
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  margin-top: 4px;
  overflow: hidden;
}
.cxs-scan-top-row {
  display: flex;
  align-items: center;
  gap: 6px;
}
.cxs-scan-top-row span { flex: 1; }
.cxs-scan-stop-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 4px;
  width: 22px; height: 22px;
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.cxs-scan-stop-btn:hover { color: var(--error); border-color: var(--error); }
.cxs-scan-detail {
  font-size: 10px;
  color: var(--muted);
  margin-top: 3px;
  opacity: 0.8;
  min-height: 14px;
}
.cxs-scan-progress-fill {
  height: 100%;
  background: var(--accent);
  transition: width 0.3s;
  width: 0%;
}

/* ── Result list ────────────────────────────────────── */
.cxs-result-list {
  flex: 1;
  overflow-y: auto;
  padding: 0;
}
.cxs-placeholder {
  padding: 40px 20px;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
}

/* ── Result item ────────────────────────────────────── */
.cxs-result-item {
  padding: 10px 14px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  transition: background 0.1s;
  outline: none;
}
.cxs-result-item:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}
.cxs-result-item:hover {
  background: var(--bg-hover);
}
.cxs-result-item.active {
  background: var(--accent-bg);
  border-left: 3px solid var(--accent);
}
.cxs-result-title {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
}
.cxs-result-title-text {
  font-size: 14px;
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}
.cxs-result-path {
  font-size: 11px;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-bottom: 3px;
}

/* ── Type badges ────────────────────────────────────── */
.cxs-type-badge {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 8px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  flex-shrink: 0;
}
.cxs-type-badge.md {
  background: rgba(74, 222, 128, 0.2);
  color: #4ade80;
}
.cxs-type-badge.chat {
  background: rgba(96, 165, 250, 0.2);
  color: #60a5fa;
}
.cxs-type-badge.prompt {
  background: rgba(251, 146, 60, 0.2);
  color: #fb923c;
}
.cxs-type-badge.txt {
  background: rgba(168, 162, 158, 0.25);
  color: #a8a29e;
}
.cxs-type-badge.pdf {
  background: rgba(239, 68, 68, 0.2);
  color: #ef4444;
}
.cxs-type-badge.docx {
  background: rgba(59, 130, 246, 0.2);
  color: #3b82f6;
}
.cxs-type-badge.odt {
  background: rgba(34, 197, 94, 0.2);
  color: #22c55e;
}
.cxs-type-badge.rtf {
  background: rgba(168, 85, 247, 0.2);
  color: #a855f7;
}

/* ── Snippet ────────────────────────────────────────── */
.cxs-result-snippet {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.5;
  max-height: 3em;
  overflow: hidden;
  word-break: break-all;
}
.cxs-result-snippet mark {
  background: var(--mark-bg);
  color: var(--mark-fg);
  border-radius: 2px;
  padding: 0 1px;
}

/* ── Link indicator ─────────────────────────────────── */
.cxs-link-icon {
  font-size: 11px;
  color: var(--muted);
  flex-shrink: 0;
  opacity: 0.6;
}
.cxs-result-item:hover .cxs-link-icon {
  opacity: 1;
  color: var(--accent);
}
</style>
