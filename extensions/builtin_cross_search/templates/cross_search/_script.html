<script nonce="{{ csp_nonce }}">
(function() {
  'use strict';

  var API_BASE = '/ext/cross-search';
  var debounceTimer = null;
  var cachedRoots = [];
  var _searchAbort = null;

  var SYSTEM_OPEN = {'.pdf': true, '.docx': true, '.odt': true, '.rtf': true};

    // ── Toast notification (alert replacement) ────────────────────────────
  function _toast(msg, isError) {
    if (window.showToast) {
      window.showToast(msg, !!isError);
    } else {
      console.warn('[CXS]', msg);
    }
  }

    // ── DOM elements ──────────────────────────────────────────
  var elSearch    = document.getElementById('cxsSearch');
  var elTargetRow = document.getElementById('cxsTargetRow');
  var elResultList = document.getElementById('cxsResultList');
  var elResultCount = document.getElementById('cxsResultCount');
  var elScanBtn   = document.getElementById('cxsScanBtn');
  var elScanBar   = document.getElementById('cxsScanBar');
  var elScanMsg   = document.getElementById('cxsScanMsg');
  var elScanFill  = document.getElementById('cxsScanFill');
  var elScanDetail = document.getElementById('cxsScanDetail');
  var elScanStop  = document.getElementById('cxsScanStop');
  var elHeader    = document.getElementById('cxsHeader');
  var elTitle     = document.getElementById('cxsTitle');
  var elMeta      = document.getElementById('cxsMeta');
  var elBody      = document.getElementById('cxsBody');
  var elViewerBtn = document.getElementById('cxsViewerBtn');
  var elSidebar   = document.getElementById('cxsSidebar');
  var elDrawerToggle = document.getElementById('cxsDrawerToggle');
  var elBackdrop  = document.getElementById('cxsBackdrop');

    // Root management DOM
  var elRootsToggle = document.getElementById('cxsRootsToggle');
  var elRootsArrow  = document.getElementById('cxsRootsArrow');
  var elRootsBody   = document.getElementById('cxsRootsBody');
  var elRootsCount  = document.getElementById('cxsRootsCount');
  var elRootsList   = document.getElementById('cxsRootsList');
  var elRootBrowse  = document.getElementById('cxsRootBrowse');
  var elRootManual  = document.getElementById('cxsRootManual');
  var elRootInputRow = document.getElementById('cxsRootInputRow');
  var elRootInput   = document.getElementById('cxsRootInput');
  var elRootInputOk = document.getElementById('cxsRootInputOk');
  var elRootInputCancel = document.getElementById('cxsRootInputCancel');

    // marked.js (loaded by md-viewer-vendor.js)
  var marked = window._mdvMarked || null;

  function renderMarkdown(text) {
    if (!marked) return escapeHtml(text).replace(/\n/g, '<br>');
    try {
      var raw = typeof marked === 'function' ? marked(text) : marked.parse(text);
      return sanitizeHtml(raw);
    } catch (e) {
      return escapeHtml(text).replace(/\n/g, '<br>');
    }
  }

    // ── Search ──────────────────────────────────────────────
  elSearch.addEventListener('input', function() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(runSearch, 300);
  });

  elSearch.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      clearTimeout(debounceTimer);
      runSearch();
    }
  });

  var checkboxes = elTargetRow.querySelectorAll('input[type="checkbox"]');
  for (var i = 0; i < checkboxes.length; i++) {
    checkboxes[i].addEventListener('change', function() {
      if (elSearch.value.trim()) runSearch();
    });
  }

  function getSelectedTargets() {
    var boxes = elTargetRow.querySelectorAll('input[type="checkbox"]:checked');
    var targets = [];
    for (var i = 0; i < boxes.length; i++) {
      targets.push(boxes[i].value);
    }
    return targets;
  }

  function runSearch() {
    var query = elSearch.value.trim();
    if (!query) {
      elResultList.innerHTML = '<div class="cxs-placeholder">検索キーワードを入力してください</div>';
      elResultCount.textContent = '0 件';
      return;
    }

    var targets = getSelectedTargets();
    if (!targets.length) {
      elResultList.innerHTML = '<div class="cxs-placeholder">検索対象を1つ以上選択してください</div>';
      return;
    }

        // Abort previous request
    if (_searchAbort) _searchAbort.abort();
    _searchAbort = new AbortController();

    var params = new URLSearchParams();
    params.set('q', query);
    params.set('target', targets.join(','));
    params.set('limit', '100');

    var signal = _searchAbort.signal;
    var timeout = setTimeout(function() { _searchAbort.abort(); }, 30000);

    fetch(API_BASE + '/api/search?' + params.toString(), { signal: signal })
      .then(function(r) { clearTimeout(timeout); return r.json(); })
      .then(function(data) {
        if (data.error) {
          elResultList.innerHTML = '<div class="cxs-placeholder">Error: ' + escapeHtml(data.error) + '</div>';
          return;
        }
        renderResults(data.results || []);
        elResultCount.textContent = (data.total || 0) + ' 件';
      })
      .catch(function(e) {
        clearTimeout(timeout);
        if (e.name === 'AbortError') return;
        console.error('Cross search error:', e);
        elResultList.innerHTML = '<div class="cxs-placeholder">検索エラーが発生しました</div>';
      });
  }

    // ── Result rendering ──────────────────────────────────
  function getFileExt(path) {
    if (!path) return '';
    var dot = path.lastIndexOf('.');
    return dot >= 0 ? path.substring(dot).toLowerCase() : '';
  }

  function getBadgeLabel(type, path) {
    if (type === 'txt' && path) {
      var ext = getFileExt(path);
      if (ext && ext !== '.txt') return ext.substring(1);
    }
    return type;
  }

  function getBadgeClass(type, path) {
    if (type !== 'txt') return type;
    var ext = getFileExt(path);
    switch (ext) {
      case '.pdf':  return 'pdf';
      case '.docx': return 'docx';
      case '.odt':  return 'odt';
      case '.rtf':  return 'rtf';
      default:      return 'txt';
    }
  }

  function renderResults(results) {
    if (!results.length) {
      elResultList.innerHTML = '<div class="cxs-placeholder">結果なし</div>';
      return;
    }

    var html = '';
    for (var i = 0; i < results.length; i++) {
      var r = results[i];
      var type = r.type || 'unknown';
      var title = r.title || r.path || '(untitled)';
      var path = r.path || '';
      var badgeLabel = getBadgeLabel(type, path);
      var badgeClass = getBadgeClass(type, path);

      var pathLine = '';
      if (path) {
        pathLine = '<div class="cxs-result-path">' + escapeHtml(shortenPath(path)) + '</div>';
      }
      if (type === 'chat' && r.source) {
        pathLine = '<div class="cxs-result-path">' + escapeHtml(r.source) + (r.role ? ' / ' + escapeHtml(r.role) : '') + '</div>';
      }

      html += '<div class="cxs-result-item" tabindex="0" role="button"'
        + ' data-type="' + escapeHtml(type) + '"'
        + ' data-id="' + (r.id || 0) + '"'
        + (r.conversation_id ? ' data-conv-id="' + r.conversation_id + '"' : '')
        + (path ? ' data-path="' + escapeHtml(path) + '"' : '')
        + '>'
        + '<div class="cxs-result-title">'
        + '<span class="cxs-type-badge ' + escapeHtml(badgeClass) + '">' + escapeHtml(badgeLabel) + '</span>'
        + '<span class="cxs-result-title-text">' + escapeHtml(title) + '</span>'
        + '</div>'
        + pathLine
        + '<div class="cxs-result-snippet">' + sanitizeSnippet(r.snippet || '') + '</div>'
        + '</div>';
    }
    elResultList.innerHTML = html;
  }

    // ── Event delegation: result list ──────────────────────────
  elResultList.addEventListener('click', function(e) {
    var item = e.target.closest('.cxs-result-item');
    if (item) { onResultClick({ currentTarget: item }); }
  });
  elResultList.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') {
      var item = e.target.closest('.cxs-result-item');
      if (item) { e.preventDefault(); onResultClick({ currentTarget: item }); }
    }
  });

    // ── Result click -> display content on right side ────────────────
  function onResultClick(e) {
    var el = e.currentTarget;
    var type = el.getAttribute('data-type');
    var id = parseInt(el.getAttribute('data-id') || '0', 10);
    var path = el.getAttribute('data-path') || '';

    var prev = elResultList.querySelector('.cxs-result-item.active');
    if (prev) prev.classList.remove('active');
    el.classList.add('active');

    closeDrawer();

    switch (type) {
      case 'md':
        if (id) loadMdContent(id);
        break;
      case 'chat':
        var convId = parseInt(el.getAttribute('data-conv-id') || '0', 10);
        if (convId) loadChatContent(convId);
        break;
      case 'txt':
        if (id) loadDocContent(id, path);
        break;
      case 'prompt':
        if (id) loadPromptContent(id);
        break;
      default:
        if (path) openInSystem(path);
        break;
    }
  }

    // ── Header + viewer button setup ─────────────────────
  function showHeader(title, meta, viewerUrl) {
    elHeader.style.display = '';
    elTitle.textContent = title;
    elMeta.textContent = meta || '';
        // Ensure previous onclick is cleared
    elViewerBtn.onclick = null;
    elViewerBtn.textContent = 'ビューアで開く \u2197';
    if (viewerUrl) {
      elViewerBtn.href = viewerUrl;
      elViewerBtn.style.display = '';
    } else {
      elViewerBtn.style.display = 'none';
    }
  }

    // ── MD content display ─────────────────────────────────
  function loadMdContent(fileId) {
    fetch('/ext/md-viewer/api/files/' + fileId)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.error) {
          showHeader('(error)', '', null);
          elBody.innerHTML = '<div class="cxs-placeholder">' + escapeHtml(data.error) + '</div>';
          return;
        }
        showHeader(data.title || '(untitled)', data.path || '', '/ext/md-viewer?file=' + fileId);
        elBody.innerHTML = '<div class="cxs-md-rendered">' + renderMarkdown(data.content || '') + '</div>';
      })
      .catch(function() {
        elBody.innerHTML = '<div class="cxs-placeholder">読み込みエラー</div>';
      });
  }

    // ── Chat content display ───────────────────────────────
  function loadChatContent(convId) {
    fetch('/ext/chatlog/api/conversations/' + convId)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.error) {
          showHeader('(error)', '', null);
          elBody.innerHTML = '<div class="cxs-placeholder">' + escapeHtml(data.error) + '</div>';
          return;
        }
        var metaParts = [];
        if (data.source) metaParts.push(data.source);
        if (data.model) metaParts.push(data.model);
        if (data.message_count) metaParts.push(data.message_count + ' 件');
        showHeader(
          data.title || '(untitled)',
          metaParts.join(' / '),
          '/ext/chatlog/?conv=' + convId
        );
        renderChatMessages(data.messages || []);
      })
      .catch(function() {
        elBody.innerHTML = '<div class="cxs-placeholder">読み込みエラー</div>';
      });
  }

  function renderChatMessages(messages) {
    if (!messages.length) {
      elBody.innerHTML = '<div class="cxs-placeholder">メッセージなし</div>';
      return;
    }
    var html = '';
    for (var i = 0; i < messages.length; i++) {
      var m = messages[i];
      var role = m.role || 'user';
      var content = m.content || '';

      html += '<div class="cxs-msg ' + escapeHtml(role) + '">';
      html += '<div class="cxs-msg-role">' + escapeHtml(role) + '</div>';
      html += '<div class="cxs-msg-content">';
      if (role === 'assistant') {
        html += renderMarkdown(content);
      } else {
        html += escapeHtml(content).replace(/\n/g, '<br>');
      }
      html += '</div></div>';
    }
    elBody.innerHTML = html;
    elBody.scrollTop = 0;
  }

    // ── Doc (TXT/PDF/DOCX etc.) content display ──────────────
  function loadDocContent(fileId, path) {
    fetch(API_BASE + '/api/txt/' + fileId)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.error) {
          showHeader('(error)', '', null);
          elBody.innerHTML = '<div class="cxs-placeholder">' + escapeHtml(data.error) + '</div>';
          return;
        }
        var ext = getFileExt(data.path || path);
        // PDF/DOCX/ODT/RTF use viewer button for "Open in file manager"
        // TXT has no viewer (self-contained here)
        showHeader(data.title || '(untitled)', data.path || '', null);
        elBody.innerHTML = '<pre class="cxs-raw-text">' + escapeHtml(data.content || '') + '</pre>';

        // Show "open in file manager" button for PDF etc.
        if (SYSTEM_OPEN[ext] && data.path) {
          elViewerBtn.style.display = '';
          elViewerBtn.href = '#';
          elViewerBtn.textContent = 'ファイルを開く \u2197';
          elViewerBtn.onclick = function(ev) {
            ev.preventDefault();
            openInSystem(data.path);
          };
        }
      })
      .catch(function() {
        elBody.innerHTML = '<div class="cxs-placeholder">読み込みエラー</div>';
      });
  }

  // ── Prompt content display ─────────────────────────────
  function loadPromptContent(promptId) {
    fetch('/ext/prompt-library/api/prompts/' + promptId)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.error) {
          showHeader('(error)', '', null);
          elBody.innerHTML = '<div class="cxs-placeholder">' + escapeHtml(data.error) + '</div>';
          return;
        }
        var p = data.prompt || data.data || data;
        showHeader(p.title || '(untitled)', 'Prompt', '/ext/prompt-library');
        elBody.innerHTML = '<pre class="cxs-raw-text">' + escapeHtml(p.content || '') + '</pre>';
      })
      .catch(function() {
        elBody.innerHTML = '<div class="cxs-placeholder">読み込みエラー</div>';
      });
  }

  // ── Open in system ────────────────────────────────────
  function openInSystem(path) {
    fetch(API_BASE + '/api/open-file', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: path }),
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.error) {
        _toast('ファイルを開けませんでした: ' + data.error, true);
      }
    })
    .catch(function() {
      _toast('ファイルを開けませんでした', true);
    });
  }

    // ── ScanRoot management ────────────────────────────────
  function toggleRoots() {
    var open = elRootsBody.style.display !== 'none';
    elRootsBody.style.display = open ? 'none' : 'block';
    elRootsArrow.classList.toggle('open', !open);
    elRootsBody.setAttribute('aria-hidden', open ? 'true' : 'false');
    elRootsToggle.setAttribute('aria-expanded', open ? 'false' : 'true');
  }
  elRootsToggle.addEventListener('click', toggleRoots);
  elRootsToggle.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleRoots(); }
  });

  elRootBrowse.addEventListener('click', function() {
    fetch('/api/tools/select-folder')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.path) addRootPath(data.path);
      })
      .catch(function(e) {
        console.error('Cross Search: folder select error', e);
        _toast('フォルダ選択に失敗しました', true);
      });
  });

  elRootManual.addEventListener('click', function() {
    elRootInputRow.style.display = 'flex';
    elRootInputRow.setAttribute('aria-hidden', 'false');
    elRootInput.value = '';
    elRootInput.focus();
  });

  elRootInputOk.addEventListener('click', function() {
    var p = elRootInput.value.trim();
    if (p) addRootPath(p);
  });

  elRootInputCancel.addEventListener('click', hideManualInput);

  elRootInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      var p = elRootInput.value.trim();
      if (p) addRootPath(p);
    }
    if (e.key === 'Escape') hideManualInput();
  });

  function hideManualInput() {
    elRootInputRow.style.display = 'none';
    elRootInputRow.setAttribute('aria-hidden', 'true');
    elRootInput.value = '';
  }

  function addRootPath(path) {
    var lc = path.toLowerCase().replace(/\\/g, '/');
    for (var i = 0; i < cachedRoots.length; i++) {
      if (cachedRoots[i].toLowerCase().replace(/\\/g, '/') === lc) {
        _toast('このパスは既に登録されています。', true);
        return;
      }
    }
    saveScanRoots(cachedRoots.concat([path]));
    hideManualInput();
  }

  function saveScanRoots(roots) {
    fetch(API_BASE + '/api/scan-roots', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Requested-With': 'XMLHttpRequest'
      },
      body: JSON.stringify({ roots: roots }),
    })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.ok) loadScanRoots();
        else if (data.error) _toast(data.error, true);
      })
      .catch(function(e) { console.error('Cross Search: save roots error', e); });
  }

  function loadScanRoots() {
    fetch(API_BASE + '/api/scan-roots')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        renderRootsList(data.roots || [], data.is_custom);
      })
      .catch(function(e) { console.error('Cross Search: load roots error', e); });
  }

  // ── Event delegation: root list ──────────────────────
  elRootsList.addEventListener('click', function(e) {
    var del = e.target.closest('.cxs-roots-item-del');
    if (del) { onRemoveRoot({ currentTarget: del }); }
  });

  function renderRootsList(roots, isCustom) {
    cachedRoots = roots.map(function(v) { return v.path; });
    elRootsCount.textContent = cachedRoots.length;

    if (!roots.length) {
      elRootsList.innerHTML = '<div class="cxs-roots-fallback">'
        + (isCustom ? 'ディレクトリ未登録' : 'グローバル scan_roots を使用 (未設定)')
        + '</div>';
      return;
    }

    var html = '';
    if (!isCustom) {
      html += '<div class="cxs-roots-fallback">グローバル scan_roots を使用中</div>';
    }
    for (var i = 0; i < roots.length; i++) {
      var v = roots[i];
      var iconCls = v.exists ? 'cxs-roots-item-icon ok' : 'cxs-roots-item-icon ng';
      var iconChar = v.exists ? '&#10003;' : '&#10007;';
      html += '<div class="cxs-roots-item">'
        + '<span class="' + iconCls + '">' + iconChar + '</span>'
        + '<span class="cxs-roots-item-path" title="' + escapeHtml(v.path) + '">' + escapeHtml(v.path) + '</span>'
        + '<button class="cxs-roots-item-del" data-index="' + i + '" title="削除" aria-label="削除: ' + escapeHtml(v.path) + '">&times;</button>'
        + '</div>';
    }
    elRootsList.innerHTML = html;
  }

  function onRemoveRoot(e) {
    var idx = parseInt(e.currentTarget.getAttribute('data-index'), 10);
    var path = cachedRoots[idx] || '';
    if (!confirm('このディレクトリを削除しますか?\n' + path)) return;
    fetch(API_BASE + '/api/scan-roots/' + idx, {
      method: 'DELETE',
      headers: { 'X-Requested-With': 'XMLHttpRequest' }
    })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.ok) loadScanRoots();
        else if (data.error) _toast(data.error, true);
      })
      .catch(function(e) { console.error('Cross Search: remove root error', e); });
  }

    // ── Scan ──────────────────────────────────────────
  elScanBtn.addEventListener('click', function() {
    fetch(API_BASE + '/api/scan', {
      method: 'POST',
      headers: { 'X-Requested-With': 'XMLHttpRequest' }
    })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.error) {
          _toast(data.error, true);
          return;
        }
        elScanBar.classList.add('active');
        pollScanStatus();
      })
      .catch(function(e) {
        _toast('スキャン開始に失敗しました: ' + e.message, true);
      });
  });

  var scanPollTimer = null;
  function pollScanStatus() {
    fetch(API_BASE + '/api/scan/status')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.running) {
          elScanMsg.textContent = data.message || 'スキャン中...';
          if (data.total > 0) {
            var pct = data.percent || Math.round((data.current / data.total) * 100);
            elScanFill.style.width = pct + '%';
          }
          // P3: Worker status details
          var details = [];
          if (data.worker_pid) details.push('PID: ' + data.worker_pid);
          if (data.memory_rss) details.push('Memory: ' + formatBytes(data.memory_rss));
          if (data.elapsed_seconds) details.push(formatElapsed(data.elapsed_seconds));
          if (data.detail) details.push(data.detail);
          elScanDetail.textContent = details.join(' | ');
          scanPollTimer = setTimeout(pollScanStatus, 2000);
        } else {
          elScanBar.classList.remove('active');
          elScanFill.style.width = '0%';
          // Temporarily display completion message
          if (data.message) {
            elScanDetail.textContent = '';
            elScanMsg.textContent = data.message;
            if (data.elapsed_seconds) {
              elScanDetail.textContent = formatElapsed(data.elapsed_seconds);
            }
            elScanBar.classList.add('active');
            setTimeout(function() { elScanBar.classList.remove('active'); }, 5000);
          }
          if (elSearch.value.trim()) runSearch();
        }
      })
      .catch(function() {
        elScanBar.classList.remove('active');
      });
  }

    // Scan stop button
  elScanStop.addEventListener('click', function() {
    fetch(API_BASE + '/api/scan/stop', {
      method: 'POST',
      headers: { 'X-Requested-With': 'XMLHttpRequest' }
    })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.error) _toast(data.error, true);
      })
      .catch(function(e) { console.error('Cross Search: stop error', e); });
  });

    // ── Mobile drawer ──────────────────────────────────
  function openDrawer() {
    elSidebar.classList.add('drawer-open');
    elBackdrop.classList.add('active');
  }
  function closeDrawer() {
    elSidebar.classList.remove('drawer-open');
    elBackdrop.classList.remove('active');
  }
  elDrawerToggle.addEventListener('click', function() {
    if (elSidebar.classList.contains('drawer-open')) {
      closeDrawer();
    } else {
      openDrawer();
    }
  });
  elBackdrop.addEventListener('click', closeDrawer);

    // ── Initialization ────────────────────────────────────────────
  // Prepare for marked being lazy-loaded
  var _markedPollCount = 0;
  function waitForMarked() {
    if (window._mdvMarked) {
      marked = window._mdvMarked;
    } else if (++_markedPollCount < 50) {
      setTimeout(waitForMarked, 200);
    }
  }
  waitForMarked();

  loadScanRoots();
  elSearch.focus();
})();
</script>
