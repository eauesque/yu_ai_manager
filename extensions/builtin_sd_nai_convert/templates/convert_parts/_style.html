<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg, #0f0f1a);
    color: var(--text, #e0e0e0);
    padding: 20px;
    padding-top: calc(var(--nav-h, 50px) + 10px);
    max-width: 900px;
    margin: 0 auto;
  }
  h1 { font-size: 20px; margin-bottom: 16px; }
  h1 span { font-size: 24px; }
  .direction-toggle {
    display: flex; gap: 8px; margin-bottom: 16px;
  }
  .direction-toggle button {
    flex: 1; padding: 10px; border: 1px solid rgba(102,126,234,0.3);
    border-radius: 8px; background: rgba(102,126,234,0.05);
    color: var(--text, #e0e0e0); cursor: pointer; font-size: 14px;
    transition: all 0.2s;
  }
  .direction-toggle button.active {
    background: rgba(102,126,234,0.2); border-color: var(--accent, #667eea);
    font-weight: 600;
  }
  .direction-toggle button:hover { background: rgba(102,126,234,0.15); }
  .panel { display: flex; gap: 12px; margin-bottom: 12px; }
  .panel > div { flex: 1; }
  label, .panel > div > span:first-child { display: block; font-size: 12px; color: var(--muted, #aab2c0); margin-bottom: 4px; font-weight: 500; }
  textarea {
    width: 100%; min-height: 140px; padding: 10px; border-radius: 8px;
    border: 1px solid rgba(128,128,128,0.2); background: rgba(30,30,50,0.8);
    color: var(--text, #e0e0e0); font-family: monospace; font-size: 13px;
    resize: vertical; line-height: 1.5;
  }
  textarea:focus { outline: none; border-color: var(--accent, #667eea); }
  .options {
    display: flex; gap: 16px; margin-bottom: 16px; padding: 10px;
    background: rgba(128,128,128,0.05); border-radius: 8px;
  }
  .options label { display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text); font-size: 13px; }
  .options input[type=checkbox] { accent-color: var(--accent, #667eea); }
  .btn-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .btn {
    padding: 8px 20px; border: 1px solid rgba(102,126,234,0.4);
    border-radius: 6px; background: rgba(102,126,234,0.1);
    color: var(--text); cursor: pointer; font-size: 13px; transition: all 0.2s;
  }
  .btn:hover { background: rgba(102,126,234,0.25); border-color: var(--accent, #667eea); }
  .btn-primary { background: rgba(102,126,234,0.3); font-weight: 600; }
  .btn:active { transform: scale(0.97); }
  .copy-btn {
    padding: 4px 10px; border: 1px solid rgba(128,128,128,0.3);
    border-radius: 4px; background: none; color: var(--muted, #aab2c0); cursor: pointer;
    font-size: 11px; float: right; min-width: 28px; min-height: 28px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .copy-btn:hover { color: var(--text); background: rgba(128,128,128,0.1); }
  .diff { font-size: 12px; color: var(--muted, #aab2c0); margin-top: 4px; }
  .diff .added { color: #6bcf6b; }
  .diff .removed { color: #cf6b6b; text-decoration: line-through; }
  @media (max-width: 768px) {
    .btn-row { gap: 6px; }
    .btn { padding: 8px 12px; font-size: 12px; }
  }
  @media (max-width: 600px) {
    .panel { flex-direction: column; }
    .options { flex-wrap: wrap; }
    .btn { padding: 10px 14px; font-size: 13px; min-height: 40px; }
    .copy-btn { padding: 4px 10px; font-size: 13px; min-height: 32px; }
  }
</style>
