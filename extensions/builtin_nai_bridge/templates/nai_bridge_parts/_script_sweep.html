<script nonce="{{ csp_nonce }}">
  "use strict";

  // Sweep axis wildcard expansion (shared across all bridges via window).
  // Each bridge's _script_sweep.html idempotently installs this helper so the
  // first one wins; the rest reuse the cached fetch promise.
  if (typeof window._sweepLoadAxes !== "function") {
    window._sweepAxesCache = null;
    window._sweepAxesPromise = null;
    window._sweepAxesReadyCallbacks = [];
    // Register a callback to fire once axes have loaded. If already loaded,
    // fires synchronously. Used by macro renderers so they can re-display
    // the per-slot count and fill the axis-insert <select>.
    window._sweepOnAxesReady = function(cb) {
      if (typeof cb !== "function") return;
      if (window._sweepAxesCache) { try { cb(); } catch (_e) {} return; }
      window._sweepAxesReadyCallbacks.push(cb);
    };
    window._sweepLoadAxes = function() {
      if (window._sweepAxesCache) return Promise.resolve(window._sweepAxesCache);
      if (window._sweepAxesPromise) return window._sweepAxesPromise;
      window._sweepAxesPromise = fetch("/ext/prompt-sim/sweep-axes", { credentials: "same-origin" })
        .then(function(r) { return r.ok ? r.json() : { axes: {} }; })
        .then(function(d) { window._sweepAxesCache = (d && d.axes) || {}; return window._sweepAxesCache; })
        .catch(function() { window._sweepAxesCache = {}; return {}; })
        .then(function(c) {
          var cbs = window._sweepAxesReadyCallbacks.splice(0);
          for (var i = 0; i < cbs.length; i++) { try { cbs[i](); } catch (_e) {} }
          return c;
        });
      return window._sweepAxesPromise;
    };
    // Build a small <select> that inserts ``__name__`` tokens (one per line)
    // into the given textarea — gives users an autocomplete-style helper for
    // axis-file references. Refills automatically when axes load.
    window._sweepBuildAxisInsertSelect = function(targetTextarea) {
      var sel = document.createElement("select");
      sel.style.cssText = "font-size:11px;max-width:160px;";
      sel.title = window.tr ? window.tr('sweep_axes.insert_axis_title', '軸ファイルを挿入 (__name__ として追加)') : 'insert axis file';
      function refill() {
        while (sel.firstChild) sel.removeChild(sel.firstChild);
        var head = document.createElement("option");
        head.value = "";
        head.textContent = window.tr ? window.tr('sweep_axes.insert_axis', '+ 軸ファイル挿入') : '+ insert axis';
        sel.appendChild(head);
        var axes = window._sweepAxesCache || {};
        var names = Object.keys(axes).sort();
        if (names.length === 0) {
          var none = document.createElement("option");
          none.disabled = true;
          none.textContent = window.tr ? window.tr('sweep_axes.no_axes', '(軸ファイル無し)') : '(no axis files)';
          sel.appendChild(none);
          return;
        }
        for (var i = 0; i < names.length; i++) {
          var name = names[i];
          var opt = document.createElement("option");
          opt.value = name;
          var n = (axes[name] || []).length;
          opt.textContent = "__" + name + "__ (" + n + ")";
          sel.appendChild(opt);
        }
      }
      refill();
      window._sweepOnAxesReady(refill);
      sel.addEventListener("change", function() {
        var name = sel.value;
        if (!name) return;
        var token = "__" + name + "__";
        var cur = targetTextarea.value || "";
        var insert = (cur && !/\n$/.test(cur) ? "\n" : "") + token;
        targetTextarea.value = cur + insert;
        try { targetTextarea.dispatchEvent(new Event("input", { bubbles: true })); } catch (_e) {}
        sel.value = "";
      });
      return sel;
    };
    // Replace any value of the form ``__name__`` (after trim) with the lines
    // of that wildcard file. Other values pass through unchanged. Only a
    // sole-token reference triggers expansion, matching how SD WebUI's
    // Prompt S/R lists discrete substitution values.
    window._sweepExpandRefValues = function(values, axes) {
      if (!axes) axes = window._sweepAxesCache || {};
      var out = [];
      var pat = /^__([\w\/\-]+)__$/;
      for (var i = 0; i < values.length; i++) {
        var v = String(values[i]).trim();
        var m = v.match(pat);
        if (m && Object.prototype.hasOwnProperty.call(axes, m[1]) && Array.isArray(axes[m[1]])) {
          var lines = axes[m[1]];
          for (var j = 0; j < lines.length; j++) out.push(lines[j]);
        } else {
          out.push(values[i]);
        }
      }
      return out;
    };
  }

  // 1-axis parameter sweep runner. Activated when the Sweep section's
  // "Enable" checkbox is checked at Generate time. Locks seed (auto-generates
  // one if -1), iterates over a value series, and appends each result.

  var _SWEEP_PARAMS = {
    "scale":              { body: "scale",         dom: "nabScale",            int: false, label: "Scale"           },
    "cfg_rescale":        { body: "cfg_rescale",   dom: "nabCfgRescale",       int: false, label: "CFG Rescale"     },
    "steps":              { body: "steps",         dom: "nabSteps",            int: true,  label: "Steps"           },
    "uncond_scale":       { body: "uncond_scale",  dom: "nabUncondScale",      int: false, label: "Uncond Scale"    },
    "img2img_strength":   { body: "strength",      dom: "nabImg2ImgStrength",  int: false, label: "img2img Strength" },
    "img2img_noise":      { body: "noise",         dom: "nabImg2ImgNoise",     int: false, label: "img2img Noise"   },
    "inpaint_strength":   { body: "strength",      dom: "nabInpaintStrength",  int: false, label: "Inpaint Strength" },
    "inpaint_noise":      { body: "noise",         dom: "nabInpaintNoise",     int: false, label: "Inpaint Noise"   },
  };

  var _SWEEP_MAX = 50;
  var _sweepCancel = false;
  var _sweepRunning = false;

  function _sweepGet(id) { return document.getElementById(id); }

  function _sweepClearChildren(el) {
    while (el && el.firstChild) el.removeChild(el.firstChild);
  }

  function _sweepBuildSeries(min, max, mode, count, step) {
    if (!isFinite(min) || !isFinite(max)) return [];
    if (min === max) return [min];
    var lo = Math.min(min, max);
    var hi = Math.max(min, max);
    var values = [];
    if (mode === "step") {
      if (!(step > 0)) return [];
      for (var k = 0; k <= _SWEEP_MAX; k++) {
        var val = lo + k * step;
        if (val > hi + 1e-9) break;
        values.push(parseFloat(val.toFixed(6)));
      }
    } else {
      var n = Math.max(2, Math.min(_SWEEP_MAX, Math.floor(count)));
      for (var j = 0; j < n; j++) {
        values.push(parseFloat((lo + (hi - lo) * j / (n - 1)).toFixed(6)));
      }
    }
    return values;
  }

  function _sweepFormatVal(val, isInt) {
    if (isInt) return String(Math.round(val));
    return String(val);
  }

  // Push a single generated image into the BridgeResultPanel (right column).
  // Falls back to inline rendering inside #nabResult if the panel isn't wired.
  function _sweepAppendBlock(value, paramLabel, fmt, imgObj, elapsedMs, serverData) {
    var label = paramLabel + " = " + value;
    if (window._nabThumbStrip && typeof window._nabThumbStrip.update === "function") {
      // Pass through the server-provided prompt/meta fields (so the right
      // panel still shows the actual prompt) and prepend the sweep marker
      // line so the user can tell which image corresponds to which value.
      var sd = serverData || {};
      var prompt = sd.expanded_prompt || "";
      window._nabThumbStrip.update([imgObj], fmt, {
        elapsed_ms: elapsedMs,
        expanded_prompt: "[Sweep] " + label + (prompt ? "\n\n" + prompt : ""),
        original_prompt: sd.original_prompt,
        final_negative: sd.final_negative,
        characters: sd.characters,
        saved: sd.saved,
      });
      return;
    }
    // Fallback (panel not wired): append into the (otherwise hidden) result div.
    var result = _sweepGet("nabResult");
    if (!result) return;
    result.style.display = "";
    var wrap = document.createElement("div");
    wrap.className = "nab-sweep-item";
    wrap.style.cssText = "margin-bottom:14px;border-left:3px solid #4fc3f7;padding-left:10px;";
    var head = document.createElement("div");
    head.className = "nab-result-info";
    head.style.cssText = "font-weight:bold;color:#4fc3f7;";
    head.textContent = label;
    wrap.appendChild(head);
    if (imgObj && imgObj.base64) {
      var img = document.createElement("img");
      img.src = "data:" + fmt + ";base64," + imgObj.base64;
      img.alt = paramLabel + " sweep image";
      wrap.appendChild(img);
    }
    var meta = document.createElement("div");
    meta.className = "nab-result-info";
    meta.textContent = (window.tr ? window.tr('nai_bridge.result_seed', 'Seed') : 'Seed') + ": " +
      String(imgObj && imgObj.seed != null ? imgObj.seed : "?") +
      (elapsedMs ? "  (" + (elapsedMs / 1000).toFixed(1) + "s)" : "");
    wrap.appendChild(meta);
    result.appendChild(wrap);
  }

  function _sweepAppendError(value, paramLabel, message) {
    if (window.showToast) window.showToast(paramLabel + " = " + value + " : " + message, true);
    var result = _sweepGet("nabResult");
    if (!result) return;
    result.style.display = "";
    var div = document.createElement("div");
    div.className = "nab-result-info";
    div.style.cssText = "color:#f44336;margin-bottom:10px;";
    div.textContent = paramLabel + " = " + value + " : " + message;
    result.appendChild(div);
  }

  function _sweepUpdateStatus(text) {
    var s = _sweepGet("nabSweepStatus");
    if (s) s.textContent = text || "";
  }

  // Build a comparison grid. 1 axis -> single row of cells; 2 axes -> 2D
  // table (X across the top, Y down the left); 3 axes -> tab strip switching
  // between one X*Y grid per Z value. Each cell id is
  // `nabSweepGridCell_<zIdx>_<xIdx>_<yIdx>` so the same fill/error helpers
  // work regardless of axis count (zIdx/yIdx default to 0 for lower-dim cases).
  // ``xLabels`` / ``yLabels`` / ``zLabels`` are pre-computed header strings.
  function _sweepInitGrid(xLabels, yLabels, zLabels) {
    var host = _sweepGet("nabSweepGrid");
    if (!host) return;
    _sweepClearChildren(host);
    host.style.display = "";
    var zCount = zLabels ? zLabels.length : 1;

    if (zLabels && zLabels.length > 1) {
      var tabs = document.createElement("div");
      tabs.className = "nab-sweep-z-tabs";
      tabs.style.cssText = "display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;";
      zLabels.forEach(function(label, zi) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = label;
        btn.className = "nab-btn small";
        btn.style.cssText = "font-size:11px;" + (zi === 0 ? "background:#4fc3f7;color:#000;" : "");
        btn.addEventListener("click", function() {
          for (var k = 0; k < zCount; k++) {
            var g = _sweepGet("nabSweepGridZ_" + k);
            if (g) g.style.display = (k === zi) ? "" : "none";
          }
          Array.prototype.forEach.call(tabs.querySelectorAll("button"), function(b, k) {
            b.style.background = (k === zi) ? "#4fc3f7" : "";
            b.style.color = (k === zi) ? "#000" : "";
          });
        });
        tabs.appendChild(btn);
      });
      host.appendChild(tabs);
    }

    for (var zi = 0; zi < zCount; zi++) {
      var grid = document.createElement("div");
      grid.id = "nabSweepGridZ_" + zi;
      if (zCount > 1 && zi > 0) grid.style.display = "none";
      var table = document.createElement("table");
      table.className = "nab-sweep-grid-table";
      table.style.cssText = "border-collapse:separate;border-spacing:6px;";

      var headRow = document.createElement("tr");
      if (yLabels) {
        var corner = document.createElement("th");
        headRow.appendChild(corner);
      }
      for (var xi = 0; xi < xLabels.length; xi++) {
        var th = document.createElement("th");
        // Wrap long macro labels (e.g. "$1=red bow tie, black jacket, ...")
        // so column width stays at the image width (160px) instead of
        // pushing cells apart by the full label length.
        th.style.cssText = "font-size:12px;font-weight:600;text-align:center;padding:2px 6px;white-space:normal;overflow-wrap:anywhere;word-break:break-word;max-width:160px;line-height:1.25;";
        th.title = xLabels[xi];
        th.textContent = xLabels[xi];
        headRow.appendChild(th);
      }
      table.appendChild(headRow);

      var rowsCount = yLabels ? yLabels.length : 1;
      for (var yi = 0; yi < rowsCount; yi++) {
        var row = document.createElement("tr");
        if (yLabels) {
          var rowHead = document.createElement("th");
          rowHead.style.cssText = "font-size:12px;font-weight:600;text-align:right;padding:2px 6px;white-space:normal;overflow-wrap:anywhere;word-break:break-word;max-width:140px;line-height:1.25;";
          rowHead.title = yLabels[yi];
          rowHead.textContent = yLabels[yi];
          row.appendChild(rowHead);
        }
        for (var xi2 = 0; xi2 < xLabels.length; xi2++) {
          var td = document.createElement("td");
          td.style.cssText = "width:160px;height:160px;background:rgba(127,127,127,0.12);border-radius:4px;text-align:center;vertical-align:middle;font-size:11px;opacity:0.6;";
          td.id = "nabSweepGridCell_" + zi + "_" + xi2 + "_" + yi;
          td.textContent = "…";
          row.appendChild(td);
        }
        table.appendChild(row);
      }
      grid.appendChild(table);
      host.appendChild(grid);
    }
  }

  function _sweepFillGridCell(zIdx, xIdx, yIdx, fmt, imgObj) {
    var cell = _sweepGet("nabSweepGridCell_" + zIdx + "_" + xIdx + "_" + yIdx);
    if (!cell || !imgObj || !imgObj.base64) return;
    _sweepClearChildren(cell);
    cell.style.opacity = "1";
    cell.style.padding = "0";
    var img = document.createElement("img");
    img.src = "data:" + fmt + ";base64," + imgObj.base64;
    img.alt = "sweep cell " + zIdx + "/" + xIdx + "/" + yIdx;
    img.style.cssText = "width:100%;height:100%;object-fit:contain;cursor:zoom-in;border-radius:4px;";
    img.addEventListener("click", function() {
      // Use the in-page overlay (window.bridgeOpenFullsize from
      // bridge-app.ts) instead of window.open — Tauri / mobile in-app
      // browsers don't open new tabs, so a blob: + window.open path
      // produces a blank screen there. The data: URL is fine for an
      // inline <img>; the new-tab Blob detour is no longer needed.
      try {
        var dataUrl = "data:" + (fmt || "image/png") + ";base64," + imgObj.base64;
        if (typeof window.bridgeOpenFullsize === "function") {
          window.bridgeOpenFullsize(dataUrl);
        }
      } catch (_) {}
    });
    cell.appendChild(img);
  }

  function _sweepMarkGridError(zIdx, xIdx, yIdx, message) {
    var cell = _sweepGet("nabSweepGridCell_" + zIdx + "_" + xIdx + "_" + yIdx);
    if (!cell) return;
    _sweepClearChildren(cell);
    cell.style.color = "#f44336";
    cell.style.opacity = "1";
    cell.textContent = "✗ " + (message || "error");
  }

  // Graceful stop: let the current in-flight image finish, then stop.
  window.nabStopSweepGraceful = function() {
    if (!_sweepRunning) return;
    _sweepCancel = true;
    _sweepUpdateStatus(window.tr ? window.tr('bridge.status.stopping_graceful', 'Stopping after current generation…') : 'stopping…');
  };
  // Cross-script entry point: the action-row "Stop after current" button
  // also stops a running sweep (no-op if no sweep is in flight).
  window.nabSweepRequestCancel = function() {
    if (!_sweepRunning) return;
    _sweepCancel = true;
    _sweepUpdateStatus(window.tr ? window.tr('bridge.status.stopping_graceful', 'Stopping after current generation…') : 'stopping…');
  };
  // Backward-compat alias.
  window.nabCancelSweep = window.nabStopSweepGraceful;

  function _sweepShowCancelRow(show) {
    var row = _sweepGet("nabSweepCancelRow");
    if (row) row.style.display = show ? "flex" : "none";
  }

  // Toggle visibility of count/step inputs based on the selected mode so the
  // user can't accidentally edit the field that won't be used.
  function _sweepApplyMode() {
    [
      { mode: "nabSweepMode", count: "nabSweepCount", step: "nabSweepStep", paramSel: "nabSweepParam" },
      { mode: "nabSweepYMode", count: "nabSweepYCount", step: "nabSweepYStep", paramSel: "nabSweepYParam" },
      { mode: "nabSweepZMode", count: "nabSweepZCount", step: "nabSweepZStep", paramSel: "nabSweepZParam" },
    ].forEach(function(g) {
      // Skip macros-mode axes — _sweepApplyMacrosVisibility already hid the
      // numeric range fields and we must not un-hide them here.
      var paramSel = _sweepGet(g.paramSel);
      if (paramSel && paramSel.value === "_macros") return;
      var modeSel = _sweepGet(g.mode);
      if (!modeSel) return;
      var mode = modeSel.value || "count";
      [
        { id: g.count, show: mode === "count" },
        { id: g.step,  show: mode === "step"  },
      ].forEach(function(p) {
        var input = _sweepGet(p.id);
        if (!input) return;
        var label = document.querySelector('label[for="' + p.id + '"]');
        input.style.display = p.show ? "" : "none";
        if (label) label.style.display = p.show ? "" : "none";
        // Don't override the global Y-axis disabled state here — that is
        // managed by _sweepApplyYEnabled. Only set disabled if the input is
        // currently meant to be active (X axis is always active; Y axis
        // active only when nabSweepYEnabled is checked).
      });
    });
  }

  // ---------- Prompt macros (S/R) -------------------------------
  // Per-axis slot state. Each axis (x/y/z) has its own list of slot objects.
  // X uses `$x1` substitution markers (with `$1` as a backward-compat alias
  // pointing to the X axis); Y uses `$y1`, Z uses `$z1`. When an axis param
  // is set to "_macros" its editor becomes visible and its slots define the
  // value series for that axis.
  var _nabMacroSlots = {
    x: [{ type: "number", min: 0.4, max: 1.0, mode: "count", count: 6, step: 0.1 }],
    y: [{ type: "number", min: 0.4, max: 1.0, mode: "count", count: 3, step: 0.1 }],
    z: [{ type: "number", min: 0.4, max: 1.0, mode: "count", count: 3, step: 0.1 }],
  };

  // DOM ID set per axis. X uses unprefixed IDs (legacy); Y/Z prefix the axis
  // letter capital. Centralising lookup here keeps the rendering / build /
  // visibility helpers axis-agnostic.
  function _nabAxisIds(axis) {
    var p = axis === "x" ? "" : axis.toUpperCase();
    return {
      editor:         "nabSweep" + p + "MacrosEditor",
      list:           "nabSweep" + p + "MacrosList",
      addBtn:         "nabSweep" + p + "MacroAddBtn",
      sharedCount:    "nabSweep" + p + "MacrosSharedCount",
      sharedCountRow: "nabSweep" + p + "MacrosSharedCountRow",
      padShort:       "nabSweep" + p + "MacrosPadShort",
      paramSel:       axis === "x" ? "nabSweepParam" : ("nabSweep" + p + "Param"),
      rangeIds:       (axis === "x"
        ? ["nabSweepMin", "nabSweepMax", "nabSweepMode", "nabSweepCount", "nabSweepStep"]
        : ["nabSweep" + p + "Min", "nabSweep" + p + "Max", "nabSweep" + p + "Mode", "nabSweep" + p + "Count", "nabSweep" + p + "Step"]),
    };
  }

  // Parse text-slot values. Heuristic: if the textarea contains a newline,
  // each line is one value (commas inside a value are literal). Otherwise
  // the whole input is treated as comma-separated.
  function _nabMacroParseTextValues(text) {
    if (!text) return [];
    var raw = /\n/.test(text) ? text.split("\n") : text.split(",");
    var out = [];
    for (var i = 0; i < raw.length; i++) {
      var v = raw[i].trim();
      if (v.length > 0) out.push(v);
    }
    if (window._sweepExpandRefValues) out = window._sweepExpandRefValues(out);
    return out;
  }

  function _nabMacroTextLength(s) {
    return _nabMacroParseTextValues((s && s.text) || "").length;
  }

  function _nabMacroDerivedCount(axis) {
    var slots = _nabMacroSlots[axis];
    var textSlots = slots.filter(function(s){ return s.type === "text"; });
    if (textSlots.length === 0) return null;
    var lens = textSlots.map(_nabMacroTextLength);
    var pad = _sweepGet(_nabAxisIds(axis).padShort);
    if (pad && pad.checked) return Math.max.apply(null, lens);
    return Math.min.apply(null, lens);
  }

  function _sweepRenderMacros(axis) {
    var ids = _nabAxisIds(axis);
    var slots = _nabMacroSlots[axis];
    var list = _sweepGet(ids.list);
    if (!list) return;
    _sweepClearChildren(list);
    var multi = slots.length > 1 || slots.some(function(s){return s.type==="text";});
    var sharedRow = _sweepGet(ids.sharedCountRow);
    if (sharedRow) sharedRow.style.display = multi ? "" : "none";

    var sharedInput = _sweepGet(ids.sharedCount);
    var derived = _nabMacroDerivedCount(axis);
    if (sharedInput) {
      if (derived != null) {
        sharedInput.value = String(derived);
        sharedInput.readOnly = true;
        sharedInput.title = window.tr ? window.tr('nai_bridge.sweep_macros_count_from_text', 'テキスト slot のカンマ数から自動算出') : 'auto from text slot comma count';
        sharedInput.style.opacity = "0.7";
      } else {
        sharedInput.readOnly = false;
        sharedInput.title = "";
        sharedInput.style.opacity = "";
      }
    }

    slots.forEach(function(slot, idx) {
      var row = document.createElement("div");
      row.className = "nab-macro-slot";
      row.style.cssText = "display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px;background:rgba(127,127,127,0.06);border-radius:4px;";
      var marker = document.createElement("span");
      marker.style.cssText = "font-family:monospace;font-weight:600;color:#4fc3f7;min-width:36px;";
      marker.textContent = "$" + axis + (idx + 1);
      row.appendChild(marker);

      var typeSel = document.createElement("select");
      typeSel.style.cssText = "font-size:12px;";
      ["number", "text"].forEach(function(t) {
        var o = document.createElement("option");
        o.value = t;
        o.textContent = t === "number" ? "数値" : "テキスト";
        if (slot.type === t) o.selected = true;
        typeSel.appendChild(o);
      });
      typeSel.addEventListener("change", function() {
        slot.type = typeSel.value;
        if (slot.type === "number") {
          if (typeof slot.min !== "number") slot.min = 0;
          if (typeof slot.max !== "number") slot.max = 1;
          if (typeof slot.step !== "number") slot.step = 0.1;
        } else {
          if (typeof slot.text !== "string") slot.text = "";
        }
        _sweepRenderMacros(axis);
      });
      row.appendChild(typeSel);

      if (slot.type === "number") {
        var lblMin = document.createElement("span"); lblMin.textContent = "min"; lblMin.style.fontSize = "11px"; row.appendChild(lblMin);
        var minIn = document.createElement("input");
        minIn.type = "number"; minIn.value = slot.min; minIn.step = "0.1"; minIn.style.width = "70px";
        minIn.addEventListener("input", function() { slot.min = parseFloat(minIn.value); });
        row.appendChild(minIn);

        var lblMax = document.createElement("span"); lblMax.textContent = "max"; lblMax.style.fontSize = "11px"; row.appendChild(lblMax);
        var maxIn = document.createElement("input");
        maxIn.type = "number"; maxIn.value = slot.max; maxIn.step = "0.1"; maxIn.style.width = "70px";
        maxIn.addEventListener("input", function() { slot.max = parseFloat(maxIn.value); });
        row.appendChild(maxIn);

        if (!multi) {
          if (slot.mode !== "step" && slot.mode !== "count") slot.mode = "count";
          var modeSel = document.createElement("select");
          modeSel.style.cssText = "font-size:12px;";
          [
            { v: "count", label: window.tr ? window.tr('nai_bridge.sweep_mode_count', '枚数で等分割') : 'count' },
            { v: "step",  label: window.tr ? window.tr('nai_bridge.sweep_mode_step',  '間隔で刻む')   : 'step'  },
          ].forEach(function(opt) {
            var o = document.createElement("option");
            o.value = opt.v; o.textContent = opt.label;
            if (slot.mode === opt.v) o.selected = true;
            modeSel.appendChild(o);
          });
          modeSel.addEventListener("change", function() {
            slot.mode = modeSel.value;
            _sweepRenderMacros(axis);
          });
          row.appendChild(modeSel);

          if (slot.mode === "step") {
            var lblStep = document.createElement("span"); lblStep.textContent = "step"; lblStep.style.fontSize = "11px"; row.appendChild(lblStep);
            var stepIn = document.createElement("input");
            stepIn.type = "number"; stepIn.value = slot.step != null ? slot.step : 0.1;
            stepIn.step = "0.1"; stepIn.min = "0.0001"; stepIn.style.width = "70px";
            stepIn.addEventListener("input", function() { slot.step = parseFloat(stepIn.value); });
            row.appendChild(stepIn);
          } else {
            var lblCount = document.createElement("span"); lblCount.textContent = "count"; lblCount.style.fontSize = "11px"; row.appendChild(lblCount);
            var countIn = document.createElement("input");
            countIn.type = "number"; countIn.value = slot.count != null ? slot.count : 6;
            countIn.min = "2"; countIn.max = "500"; countIn.style.width = "70px";
            countIn.addEventListener("input", function() { slot.count = parseInt(countIn.value, 10) || 6; });
            row.appendChild(countIn);
          }
        }
      } else {
        // Text-slot editor: use PromptSyntaxWidget for strength colouring
        // (parens / brackets) so macro values look like the main prompt.
        // Falls back to a plain textarea if the widget isn't available.
        var taPlaceholder = window.tr
          ? window.tr('nai_bridge.sweep_macros_text_placeholder', '1 行 1 値 (改行区切り)、または 1 行のとき , で区切り\n例:\n  a, b, c\n  d')
          : 'one value per line (newline-separated), or comma-separated when single line\nexample:\n  a, b, c\n  d';
        var taWrap = document.createElement("div");
        taWrap.className = "nab-editor-wrap";
        taWrap.style.cssText = "flex:1;min-width:200px;";
        var ta;
        if (typeof PromptSyntaxWidget !== "undefined" && PromptSyntaxWidget.createEditor) {
          try {
            var _ed = PromptSyntaxWidget.createEditor(taWrap, {
              value: slot.text || "",
              placeholder: taPlaceholder,
              rows: 5,
              showSyntaxBar: false,
              showErrors: false,
            });
            ta = _ed.getTextarea();
          } catch (_e) { ta = null; }
        }
        if (!ta) {
          ta = document.createElement("textarea");
          ta.placeholder = taPlaceholder;
          ta.value = slot.text || "";
          ta.style.cssText = "width:100%;min-height:104px;font-size:12px;font-family:monospace;";
          taWrap.appendChild(ta);
        }
        var lenLabel = document.createElement("span");
        lenLabel.style.cssText = "font-size:11px;opacity:0.7;min-width:96px;align-self:flex-start;margin-top:4px;white-space:nowrap;";
        function _nabMacroRenderLen() {
          var raw = slot.text || "";
          var lines = raw.length === 0 ? 0 : raw.split("\n").length;
          lenLabel.textContent = "行=" + lines + " 値=" + _nabMacroTextLength(slot);
        }
        _nabMacroRenderLen();
        ta.addEventListener("input", function() {
          slot.text = ta.value;
          var sInput = _sweepGet(ids.sharedCount);
          var d = _nabMacroDerivedCount(axis);
          if (sInput && d != null) sInput.value = String(d);
          _nabMacroRenderLen();
        });
        row.appendChild(taWrap);
        if (window._sweepBuildAxisInsertSelect) {
          row.appendChild(window._sweepBuildAxisInsertSelect(ta));
        }
        row.appendChild(lenLabel);
      }

      var rmBtn = document.createElement("button");
      rmBtn.type = "button";
      rmBtn.textContent = "×";
      rmBtn.title = "remove";
      rmBtn.style.cssText = "background:transparent;border:1px solid rgba(127,127,127,0.3);color:inherit;cursor:pointer;width:24px;height:24px;border-radius:4px;";
      rmBtn.addEventListener("click", function() {
        slots.splice(idx, 1);
        if (slots.length === 0) {
          slots.push({ type: "number", min: 0.4, max: 1.0, mode: "count", count: 6, step: 0.1 });
        }
        _sweepRenderMacros(axis);
      });
      row.appendChild(rmBtn);

      list.appendChild(row);
    });
  }

  // Reverse of _nabMacroBuildSeries: rebuild slot state for a given axis from
  // a recorded per-iteration series of {slot_idx: value} dicts. Used by
  // SweepResume when re-running a macros-axis sweep. Default axis = "x" for
  // backward compatibility with older saved sweeps that only had X macros.
  window._nabRestoreSweepMacros = function(series, axis) {
    if (!axis) axis = "x";
    var diag = "[nab/restore-macros] axis=" + axis;
    if (!Array.isArray(series) || series.length === 0) {
      console.warn(diag + " — empty series, skipping");
      return;
    }
    if (!_nabMacroSlots[axis]) {
      console.warn(diag + " — _nabMacroSlots['" + axis + "'] missing");
      return;
    }
    var first = series[0];
    if (typeof first !== "object" || first === null) {
      console.warn(diag + " — first series entry is not an object: " + JSON.stringify(first));
      return;
    }
    console.log(diag + " — restoring " + series.length + " entries");
    var keys = Object.keys(first)
      .map(function(k) { return parseInt(k, 10); })
      .filter(function(n) { return !isNaN(n); })
      .sort(function(a, b) { return a - b; });
    if (keys.length === 0) return;
    var newSlots = [];
    keys.forEach(function(k) {
      var vals = series.map(function(s) { return s ? s[k] : undefined; });
      var firstVal = vals[0];
      if (typeof firstVal === "string") {
        // Join with newlines so the macros parser treats each value as a
        // separate slot value. Joining with ", " corrupts values that
        // themselves contain commas (e.g., "red, hat") — the input box would
        // then re-split them. Newline-joined text matches the per-line input
        // form users typically paste in.
        newSlots.push({ type: "text", text: vals.join("\n") });
      } else {
        var nums = vals
          .map(function(v) { return Number(v); })
          .filter(function(n) { return !isNaN(n); });
        if (nums.length === 0) {
          newSlots.push({ type: "number", min: 0, max: 1, mode: "count", count: 6, step: 0.1 });
        } else {
          var mn = Math.min.apply(null, nums);
          var mx = Math.max.apply(null, nums);
          newSlots.push({
            type: "number", min: mn, max: mx,
            mode: "count", count: nums.length, step: 0.1,
          });
        }
      }
    });
    _nabMacroSlots[axis] = newSlots;
    _sweepRenderMacros(axis);
    _sweepApplyMacrosVisibility();
  };

  function _nabMacroAdd(axis) {
    _nabMacroSlots[axis].push({ type: "number", min: 0, max: 1, mode: "count", count: 6 });
    _sweepRenderMacros(axis);
  }

  // Compute series for current macro slots of *axis*. Returns
  //   { count, valuesPerIter: [{1: v1, 2: v2}, ...] }
  // or null on validation failure. Pass silent=true to suppress error
  // toasts (used by the live total-estimate display so partial / invalid
  // edits don't spam toasts).
  function _nabMacroBuildSeries(axis, silent) {
    var ids = _nabAxisIds(axis);
    var slots = _nabMacroSlots[axis];
    var axisLabel = axis.toUpperCase();
    if (slots.length === 0) {
      if (!silent) window.showToast((window.tr ? window.tr('nai_bridge.sweep_macros_empty', 'マクロ slot がありません') : 'no macro slots') + " (" + axisLabel + ")", true);
      return null;
    }
    var multi = slots.length > 1 || slots.some(function(s){return s.type==="text";});
    var padShortEl = _sweepGet(ids.padShort);
    var padShort = !!(padShortEl && padShortEl.checked);
    var sharedCount;
    if (multi) {
      var textSlots = slots.filter(function(s){ return s.type === "text"; });
      var derivedFromText = _nabMacroDerivedCount(axis);
      if (derivedFromText != null) {
        if (!padShort && textSlots.length >= 2) {
          var lens = textSlots.map(_nabMacroTextLength);
          var allSame = lens.every(function(L){ return L === lens[0]; });
          if (!allSame) {
            if (!silent) window.showToast(
              (window.tr ? window.tr('nai_bridge.sweep_macros_text_length_mismatch',
                'テキスト slot のカンマ数が一致しません。揃えるか「短い slot は空白で埋める」をオン: ')
                : 'Text slots have different comma counts. Match them or enable pad-short: ') +
              lens.join(" / ") + " (" + axisLabel + ")",
              true,
            );
            return null;
          }
        }
        sharedCount = derivedFromText;
      } else {
        var sc = _sweepGet(ids.sharedCount);
        sharedCount = parseInt(sc ? sc.value : "6", 10) || 6;
      }
    } else {
      var only = slots[0];
      if (only.type === "number" && only.mode === "step" && typeof only.step === "number" && only.step > 0) {
        var derived = _sweepBuildSeries(only.min, only.max, "step", 0, only.step);
        sharedCount = derived.length;
      } else if (typeof only.count === "number" && only.count >= 2) {
        sharedCount = only.count;
      } else {
        sharedCount = 6;
      }
    }
    if (sharedCount < 1) sharedCount = 1;

    var perSlot = [];
    for (var i = 0; i < slots.length; i++) {
      var s = slots[i];
      var arr;
      if (s.type === "number") {
        if (!multi && s.mode === "step" && typeof s.step === "number" && s.step > 0) {
          arr = _sweepBuildSeries(s.min, s.max, "step", 0, s.step);
        } else {
          arr = _sweepBuildSeries(s.min, s.max, "count", sharedCount, 0.1);
        }
      } else {
        arr = _nabMacroParseTextValues(s.text || "");
        if (padShort && arr.length < sharedCount) {
          while (arr.length < sharedCount) arr.push("");
        }
      }
      if (arr.length < 1) {
        if (!silent) window.showToast((window.tr ? window.tr('nai_bridge.sweep_macros_slot_empty', 'マクロ slot $') : 'macro slot $') + axis + (i + 1) + (window.tr ? window.tr('nai_bridge.sweep_macros_slot_empty_suffix', ' に値がありません') : ' has no values'), true);
        return null;
      }
      perSlot.push(arr);
    }

    var actualCount = sharedCount;
    for (var j = 0; j < perSlot.length; j++) {
      if (perSlot[j].length < actualCount) actualCount = perSlot[j].length;
    }

    var valuesPerIter = [];
    for (var k = 0; k < actualCount; k++) {
      var entry = {};
      for (var s2 = 0; s2 < perSlot.length; s2++) {
        entry[s2 + 1] = perSlot[s2][k];
      }
      valuesPerIter.push(entry);
    }
    return { count: actualCount, valuesPerIter: valuesPerIter };
  }
</script>
