<style>
  /* Bundle selection modal */
  .nab-bundle-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 9000;
    background: rgba(0,0,0,0.55);
    align-items: center; justify-content: center;
  }
  .nab-bundle-overlay.open { display: flex; }

  .nab-bundle-dialog {
    background: var(--bg, #1a1a2e);
    border: 1px solid var(--nab-border, rgba(128,128,128,0.25));
    border-radius: 12px;
    width: min(680px, calc(100vw - 32px));
    max-height: calc(100vh - 64px);
    display: flex; flex-direction: column;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .nab-bundle-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--nab-border-dim, rgba(128,128,128,0.15));
    display: flex; align-items: center; gap: 10px;
  }
  .nab-bundle-header h3 {
    flex: 1; font-size: 14px; font-weight: 600;
    color: var(--text, #fff); margin: 0;
  }
  .nab-bundle-list {
    flex: 1; overflow-y: auto;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px; padding: 14px;
  }
  .nab-bundle-item {
    background: var(--nab-surface, rgba(30,30,50,0.8));
    border: 1px solid var(--nab-border-dim);
    border-radius: 8px; overflow: hidden;
    cursor: pointer; transition: border-color 0.15s;
  }
  .nab-bundle-item:hover { border-color: var(--accent, #7b61ff); }
  .nab-bundle-item.selected {
    border-color: var(--accent, #7b61ff);
    outline: 2px solid var(--accent, #7b61ff);
    outline-offset: -1px;
  }
  .nab-bundle-item-img {
    width: 100%; aspect-ratio: 2/3; object-fit: cover;
    display: block;
  }
  .nab-bundle-item-info {
    padding: 8px;
    display: flex; flex-direction: column; gap: 3px;
  }
  .nab-bundle-item-model {
    font-size: 10px; color: var(--text-secondary, #aaa);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .nab-bundle-item-entries { font-size: 11px; color: var(--text, #fff); }
  .nab-bundle-item-cb {
    position: absolute; top: 6px; left: 6px;
    width: 18px; height: 18px; cursor: pointer;
    accent-color: var(--accent, #7b61ff);
  }
  .nab-bundle-item-wrap {
    position: relative;
  }
  .nab-bundle-footer {
    padding: 12px 18px;
    border-top: 1px solid var(--nab-border-dim);
    display: flex; align-items: center; gap: 8px;
  }
  .nab-bundle-footer .nab-bundle-count {
    flex: 1; font-size: 12px; color: var(--text-secondary, #aaa);
  }
</style>

<div id="nabVibeBundleModal" class="nab-bundle-overlay" role="dialog"
     aria-labelledby="nabVibeBundleTitle" aria-modal="true">
  <div class="nab-bundle-dialog">
    <div class="nab-bundle-header">
      <h3 id="nabVibeBundleTitle" data-i18n="nai_bridge.vibe_bundle_title">Vibe バンドルから選択</h3>
      <button class="nab-btn small" data-action="nabCloseBundleModal"
        data-i18n="nai_bridge.vibe_bundle_cancel">キャンセル</button>
    </div>
    <div id="nabVibeBundleList" class="nab-bundle-list"></div>
    <div class="nab-bundle-footer">
      <span id="nabVibeBundleCount" class="nab-bundle-count"></span>
      <button class="nab-btn small" data-action="nabBundleSelectAll"
        data-i18n="nai_bridge.vibe_bundle_select_all">すべて選択</button>
      <button class="nab-btn primary" data-action="nabBundleLoad"
        data-i18n="nai_bridge.vibe_bundle_load">読み込む</button>
    </div>
  </div>
</div>
