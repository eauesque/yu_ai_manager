<style>

      flex-direction: column;
    }
    .nab-prompt-with-wc .nab-editor-wrap {
      order: 1;
      width: 100%;
    }
    .nab-prompt-with-wc .bwc-panel {
      width: 100%; max-height: 140px;
      order: 2;
    }
  }

  @media (max-width: 600px) {
    .nab-config-row {

    font-size: 13px;

  }

      color: var(--text, #f0f0f0);

  body:is(.dark, [data-theme="dark"]) .syntax-warning-banner[data-visible] {
