<script nonce="{{ csp_nonce }}">
  "use strict";

  // -- Character Position Picker ------------------------------------
  //
  // Two pickers, chosen by the selected model's generation:
  //
  //   V4 / V4.5 -> 5x5 grid. NovelAI quantises to cell centres there.
  //   V5        -> continuous stage. V5 dropped the grid for free coordinates.
  //
  // The generation comes from /api/models (the server owns the mapping); an
  // unknown model defaults to the continuous stage, because grid points are a
  // subset of the continuous space and the reverse does not hold.
  //
  // AI's Choice (default) = do not send a center => use_coords=false.

  // NovelAI's V4 grid values are cell centres: (2i+1)/10 for i in 0..4,
  // i.e. 0.1 / 0.3 / 0.5 / 0.7 / 0.9. Measured on real V4 images.
  function nabGridValue(index) {
    return (2 * index + 1) / 10;
  }

  function nabCurrentGeneration() {
    var gen = (typeof window.nabModelGeneration === "function")
      ? window.nabModelGeneration()
      : null;
    // Unknown model: prefer the continuous stage. A grid point is expressible
    // as a coordinate, but a coordinate is not expressible on the grid.
    return gen || "v5";
  }

  function nabUsesGrid(card) {
    var forced = card && card.getAttribute("data-pos-mode");
    if (forced) return forced === "grid";
    var gen = nabCurrentGeneration();
    return gen === "v4" || gen === "v45";
  }

  function nabSetPos(card, x, y) {
    // Four decimals: the grid needs one, V5 coordinates carry three or more,
    // and `toFixed(2)` was quietly rounding imported V5 positions.
    card.setAttribute("data-pos-x", Number(x).toFixed(4));
    card.setAttribute("data-pos-y", Number(y).toFixed(4));
    var readout = card.querySelector(".nab-charpos-readout");
    if (readout) readout.textContent = Number(x).toFixed(3) + ", " + Number(y).toFixed(3);
    var marker = card.querySelector(".nab-charpos-marker");
    if (marker) {
      marker.style.left = (Number(x) * 100).toFixed(4) + "%";
      marker.style.top = (Number(y) * 100).toFixed(4) + "%";
    }
  }

  // -- 5x5 grid (V4 / V4.5) ----------------------------------------

  function nabRenderPosGrid(gridEl) {
    gridEl.innerHTML = "";
    for (var row = 0; row < 5; row++) {
      for (var col = 0; col < 5; col++) {
        var cell = document.createElement("div");
        cell.className = "nab-charpos-cell";
        cell.setAttribute("data-col", col);
        cell.setAttribute("data-row", row);
        if (col === 2 && row === 2) cell.classList.add("selected");
        cell.addEventListener("click", function() { nabSelectPosCell(this); });
        gridEl.appendChild(cell);
      }
    }
  }

  function nabSelectPosCell(cell) {
    var grid = cell.parentElement;
    grid.querySelectorAll(".nab-charpos-cell").forEach(function(c) {
      c.classList.remove("selected");
    });
    cell.classList.add("selected");
    var card = grid.closest(".nab-char-card");
    nabSetPos(
      card,
      nabGridValue(parseInt(cell.getAttribute("data-col"), 10)),
      nabGridValue(parseInt(cell.getAttribute("data-row"), 10))
    );
  }

  function nabSyncGridSelection(card) {
    var x = parseFloat(card.getAttribute("data-pos-x"));
    var y = parseFloat(card.getAttribute("data-pos-y"));
    if (isNaN(x) || isNaN(y)) return;
    // Invert (2i+1)/10 to find the nearest cell, clamped to the grid.
    var col = Math.min(4, Math.max(0, Math.round((x * 10 - 1) / 2)));
    var row = Math.min(4, Math.max(0, Math.round((y * 10 - 1) / 2)));
    var grid = card.querySelector(".nab-charpos-grid");
    if (!grid) return;
    grid.querySelectorAll(".nab-charpos-cell").forEach(function(cell) {
      cell.classList.toggle(
        "selected",
        parseInt(cell.getAttribute("data-col"), 10) === col &&
        parseInt(cell.getAttribute("data-row"), 10) === row
      );
    });
  }

  // -- Continuous stage (V5) ---------------------------------------

  function nabStageAspect() {
    var w = parseInt((document.querySelector("[name='nab-width'], #nab-width") || {}).value, 10);
    var h = parseInt((document.querySelector("[name='nab-height'], #nab-height") || {}).value, 10);
    if (!w || !h || w <= 0 || h <= 0) return "832 / 1216";
    return w + " / " + h;
  }

  function nabPointToCoords(stage, clientX, clientY) {
    var r = stage.getBoundingClientRect();
    if (!r.width || !r.height) return null;
    // Clamp the coordinate, not the drawing position: the endpoints 0 and 1
    // must stay reachable.
    var x = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
    var y = Math.min(1, Math.max(0, (clientY - r.top) / r.height));
    return { x: x, y: y };
  }

  function nabInitStage(card) {
    var stage = card.querySelector(".nab-charpos-stage");
    if (!stage || stage.getAttribute("data-wired") === "1") return;
    stage.setAttribute("data-wired", "1");
    stage.style.aspectRatio = nabStageAspect();

    function place(ev) {
      var c = nabPointToCoords(stage, ev.clientX, ev.clientY);
      if (c) nabSetPos(card, c.x, c.y);
    }

    stage.addEventListener("pointerdown", function(ev) {
      ev.preventDefault();
      // Capture so the drag survives leaving the box; without this the marker
      // sticks the moment the pointer crosses the edge.
      stage.setPointerCapture(ev.pointerId);
      stage.setAttribute("data-dragging", "1");
      place(ev);
    });
    stage.addEventListener("pointermove", function(ev) {
      if (stage.getAttribute("data-dragging") === "1") place(ev);
    });
    function endDrag(ev) {
      stage.removeAttribute("data-dragging");
      if (stage.hasPointerCapture && stage.hasPointerCapture(ev.pointerId)) {
        stage.releasePointerCapture(ev.pointerId);
      }
    }
    stage.addEventListener("pointerup", endDrag);
    stage.addEventListener("pointercancel", endDrag);

    // Keyboard: a drag-only control is a regression against the grid, which
    // was reachable by tabbing and clicking.
    stage.setAttribute("tabindex", "0");
    stage.addEventListener("keydown", function(ev) {
      var step = ev.shiftKey ? 0.10 : 0.01;
      var dx = 0, dy = 0;
      if (ev.key === "ArrowLeft") dx = -step;
      else if (ev.key === "ArrowRight") dx = step;
      else if (ev.key === "ArrowUp") dy = -step;
      else if (ev.key === "ArrowDown") dy = step;
      else return;
      ev.preventDefault();
      var x = parseFloat(card.getAttribute("data-pos-x"));
      var y = parseFloat(card.getAttribute("data-pos-y"));
      if (isNaN(x)) x = 0.5;
      if (isNaN(y)) y = 0.5;
      nabSetPos(card, Math.min(1, Math.max(0, x + dx)), Math.min(1, Math.max(0, y + dy)));
    });

    var numX = card.querySelector(".nab-charpos-num-x");
    var numY = card.querySelector(".nab-charpos-num-y");
    function fromNumbers() {
      var x = parseFloat(numX.value), y = parseFloat(numY.value);
      if (isNaN(x) || isNaN(y)) return;
      nabSetPos(card, Math.min(1, Math.max(0, x)), Math.min(1, Math.max(0, y)));
    }
    if (numX) numX.addEventListener("change", fromNumbers);
    if (numY) numY.addEventListener("change", fromNumbers);
  }

  // -- Mode switching ----------------------------------------------

  window.nabApplyPosMode = function(card) {
    var usesGrid = nabUsesGrid(card);
    var gridWrap = card.querySelector(".nab-charpos-grid-wrap");
    var stageWrap = card.querySelector(".nab-charpos-stage-wrap");
    if (gridWrap) gridWrap.style.display = usesGrid ? "" : "none";
    if (stageWrap) stageWrap.style.display = usesGrid ? "none" : "";
    if (usesGrid) nabSyncGridSelection(card);
    else nabInitStage(card);
  };

  window.nabRefreshAllPosModes = function() {
    document.querySelectorAll(".nab-char-card").forEach(function(card) {
      var stage = card.querySelector(".nab-charpos-stage");
      if (stage) stage.style.aspectRatio = nabStageAspect();
      window.nabApplyPosMode(card);
    });
  };

  window.nabToggleCharAI = function(checkbox) {
    var card = checkbox.closest(".nab-char-card");
    var picker = card.querySelector(".nab-charpos-picker");
    if (checkbox.checked) {
      if (picker) picker.style.display = "none";
      card.removeAttribute("data-pos-x");
      card.removeAttribute("data-pos-y");
    } else {
      if (picker) picker.style.display = "";
      if (!card.getAttribute("data-pos-x")) nabSetPos(card, 0.5, 0.5);
      window.nabApplyPosMode(card);
    }
  };

  window.nabInitCharPos = function(card) {
    var grid = card.querySelector(".nab-charpos-grid");
    if (grid) nabRenderPosGrid(grid);
    window.nabApplyPosMode(card);
  };

  // Exposed so the card builder can seed an imported position without
  // re-implementing the readout/marker/number wiring.
  window.nabSetCharPos = function(card, x, y) {
    nabSetPos(card, x, y);
    var numX = card.querySelector(".nab-charpos-num-x");
    var numY = card.querySelector(".nab-charpos-num-y");
    if (numX) numX.value = Number(x).toFixed(4);
    if (numY) numY.value = Number(y).toFixed(4);
    window.nabApplyPosMode(card);
  };

  window.nabGetCharPos = function(card) {
    var cb = card.querySelector(".nab-charpos-ai");
    if (cb && cb.checked) return null;
    var x = parseFloat(card.getAttribute("data-pos-x"));
    var y = parseFloat(card.getAttribute("data-pos-y"));
    if (isNaN(x) || isNaN(y)) return null;
    return { x: x, y: y };
  };

  // Keep the stage's aspect in step with the generation size fields.
  // These are ids, not names -- the old `[name='nab-width']` selector matched
  // nothing, so the picker never followed the model or the canvas size.
  ["nabWidth", "nabHeight", "nabModel"].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.addEventListener("change", function() { window.nabRefreshAllPosModes(); });
  });

  // If receivePrompt() executed before this script,
  // retroactively initialize character cards with uninitialized grids.
  (function() {
    var cards = document.querySelectorAll(".nab-char-card .nab-charpos-grid");
    for (var i = 0; i < cards.length; i++) {
      if (!cards[i].hasChildNodes()) nabRenderPosGrid(cards[i]);
    }
    if (typeof window.nabRefreshAllPosModes === "function") window.nabRefreshAllPosModes();
  })();
</script>
