{% include "github_parts/_script_i18n_zh.html" %}

/* Detect language from page or localStorage */
var _ghubLang = (function() {
  try {
    var stored = localStorage.getItem('lang');
    if (stored && _ghubI18n[stored]) return stored;
  } catch (_) {}
  var html = document.documentElement.lang || '';
  if (_ghubI18n[html]) return html;
  var nav = (navigator.language || '').toLowerCase();
  if (nav.startsWith('zh-tw') || nav.startsWith('zh-hant')) return 'zh-tw';
  if (nav.startsWith('zh')) return 'zh-cn';
  if (nav.startsWith('ko')) return 'ko';
  if (nav.startsWith('ja')) return 'ja';
  return 'en';
})();

function _t(key, fallback) {
  var dict = _ghubI18n[_ghubLang] || _ghubI18n.en;
  return dict[key] || (_ghubI18n.en[key]) || fallback || key;
}

/* Apply i18n to static elements with data-ghub-i18n attribute */
function _ghubApplyI18n() {
  document.querySelectorAll('[data-ghub-i18n]').forEach(function(el) {
    el.textContent = _t(el.getAttribute('data-ghub-i18n'));
  });
  document.querySelectorAll('[data-ghub-i18n-ph]').forEach(function(el) {
    el.placeholder = _t(el.getAttribute('data-ghub-i18n-ph'));
  });
  document.querySelectorAll('[data-ghub-i18n-aria]').forEach(function(el) {
    el.setAttribute('aria-label', _t(el.getAttribute('data-ghub-i18n-aria')));
  });
  document.querySelectorAll('[data-ghub-i18n-title]').forEach(function(el) {
    el.title = _t(el.getAttribute('data-ghub-i18n-title'));
  });
}
