<div class="mdv-content">
  <h1 class="mdv-page-title" data-i18n="md_viewer.page_title"><span aria-hidden="true">&#128221;</span> MD Viewer</h1>
  <div class="mdv-content-header" id="mdvContentHeader" style="display:none">
    <span class="mdv-content-title" id="mdvTitle"></span>
    <div class="mdv-toggle-group">
      <button class="mdv-toggle-btn active" id="mdvToggleRendered"
              data-mode="rendered" data-i18n="md_viewer.rendered">Rendered</button>
      <button class="mdv-toggle-btn" id="mdvToggleRaw"
              data-mode="raw" data-i18n="md_viewer.raw">Raw</button>
    </div>
  </div>
  <div class="mdv-content-body" id="mdvBody">
    <div class="mdv-placeholder" data-i18n="md_viewer.select_file_placeholder">
      ファイルを選択してください
    </div>
  </div>
</div>
<!-- Mobile drawer controls -->
<div class="mdv-backdrop" id="mdvBackdrop"></div>
<button class="mdv-drawer-toggle" id="mdvDrawerToggle" aria-label="Toggle sidebar" data-i18n-aria-label="md_viewer.toggle_sidebar_aria">&#9776;</button>
