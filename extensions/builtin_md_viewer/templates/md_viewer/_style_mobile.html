<style>
/* ── Scan progress ──────────────────────────────────── */
.mdv-scan-bar {
  padding: 8px 12px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  color: var(--muted);
  display: none;
}
.mdv-scan-bar.active { display: block; }
.mdv-scan-progress {
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  margin-top: 4px;
  overflow: hidden;
}
.mdv-scan-progress-fill {
  height: 100%;
  background: var(--accent);
  transition: width 0.3s;
  width: 0%;
}

/* ── Mobile drawer toggle ──────────────────────────── */
.mdv-drawer-toggle {
  display: none;
  position: fixed;
  bottom: 20px;
  left: 20px;
  z-index: 1001;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: none;
  background: var(--accent);
  color: #fff;
  font-size: 22px;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  align-items: center;
  justify-content: center;
  line-height: 1;
}
.mdv-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: 999;
}
.mdv-backdrop.active {
  display: block;
}

/* ── Responsive: mobile drawer ─────────────────────── */
@media (max-width: 768px) {
  .mdv-drawer-toggle {
    display: flex;
  }
  .mdv-sidebar {
    position: fixed;
    top: var(--nav-h, 50px);
    left: 0;
    bottom: 0;
    width: 85vw;
    max-width: 360px;
    z-index: 1000;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    border-right: 1px solid var(--border);
    box-shadow: 4px 0 16px rgba(0,0,0,0.25);
  }
  .mdv-sidebar.drawer-open {
    transform: translateX(0);
  }
  .mdv-layout {
    display: block;
  }
  .mdv-content {
    height: calc(100vh - var(--nav-h, 50px));
  }
  .mdv-content-body { padding: 16px 16px 80px; }
}
/* 極小画面: ドロワーを広げる */
@media (max-width: 400px) {
  .mdv-sidebar { width: 92vw; }
}
</style>
