<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="sweep_axes.page_title">Sweep Axes Manager</title>
  <style nonce="{{ csp_nonce }}">
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 0; background: var(--bg, #1a1a1a); color: var(--text, #e0e0e0); }
    .sx-container { max-width: 920px; margin: 0 auto; padding: 24px 20px 60px; }
    .sx-topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .sx-topbar h1 { flex: 1; font-size: 20px; margin: 0; }
    .sx-btn { background: rgba(127,127,127,0.12); color: inherit; border: 1px solid rgba(127,127,127,0.3); border-radius: 4px; padding: 6px 12px; cursor: pointer; font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
    .sx-btn:hover { background: rgba(127,127,127,0.22); }
    .sx-btn.primary { background: #4fc3f7; color: #003040; border-color: #4fc3f7; }
    .sx-btn-sm { background: transparent; border: 1px solid rgba(127,127,127,0.3); color: inherit; cursor: pointer; padding: 2px 8px; border-radius: 3px; font-size: 11px; }
    .sx-btn-sm:hover { background: rgba(127,127,127,0.18); }
    .sx-section { background: rgba(127,127,127,0.06); border-radius: 6px; padding: 14px 16px; margin-bottom: 16px; }
    .sx-section h2 { font-size: 14px; margin: 0 0 10px; opacity: 0.85; }
    .sx-dir-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: rgba(127,127,127,0.08); border-radius: 4px; margin-bottom: 4px; font-size: 12px; }
    .sx-dir-item code { flex: 1; font-family: monospace; word-break: break-all; }
    .sx-dir-row { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
    .sx-input { flex: 1; background: rgba(0,0,0,0.25); color: inherit; border: 1px solid rgba(127,127,127,0.3); border-radius: 4px; padding: 6px 8px; font-size: 13px; font-family: monospace; }
    .sx-toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
    .sx-toggle input { width: 16px; height: 16px; }
    .sx-axis-list { font-size: 12px; }
    .sx-axis-item { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-bottom: 1px solid rgba(127,127,127,0.12); }
    .sx-axis-name { flex: 1; font-family: monospace; }
    .sx-axis-count { opacity: 0.6; min-width: 40px; text-align: right; }
    .sx-badge { font-size: 10px; padding: 1px 6px; border-radius: 8px; }
    .sx-badge.axis { background: #4fc3f7; color: #003040; }
    .sx-badge.wildcard { background: rgba(255,167,38,0.7); color: #2a1a00; }
    .sx-tree-controls { display: flex; gap: 6px; margin-bottom: 6px; }
    .sx-tree-folder { margin: 2px 0; }
    .sx-tree-folder > summary { cursor: pointer; padding: 4px 6px; border-radius: 3px; user-select: none; display: flex; align-items: center; gap: 6px; font-family: monospace; font-size: 12px; }
    .sx-tree-folder > summary:hover { background: rgba(127,127,127,0.1); }
    .sx-tree-folder > summary::-webkit-details-marker { display: none; }
    .sx-tree-folder > summary::before { content: "▸"; display: inline-block; width: 10px; opacity: 0.6; transition: transform 0.1s; }
    .sx-tree-folder[open] > summary::before { transform: rotate(90deg); }
    .sx-tree-folder-name { flex: 1; }
    .sx-tree-folder-meta { opacity: 0.55; font-size: 11px; }
    .sx-tree-children { padding-left: 16px; border-left: 1px dashed rgba(127,127,127,0.2); margin-left: 4px; }
    .sx-empty { opacity: 0.5; font-style: italic; padding: 8px 0; font-size: 12px; }
    .sx-hint { opacity: 0.65; font-size: 11px; margin-top: 6px; }
    .sx-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: #fff; padding: 8px 14px; border-radius: 4px; font-size: 12px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
    .sx-toast.show { opacity: 1; }
    .sx-validation-ok { color: #4caf50; font-size: 11px; }
    .sx-validation-fail { color: #e74c3c; font-size: 11px; }
  </style>
</head>
<body>
  {% include "_ext_nav.html" %}
  <main id="main-content">
    <div class="sx-container">
      <div class="sx-topbar">
        <h1><span aria-hidden="true">🎯</span> <span data-i18n="sweep_axes.title">Sweep Axes Manager</span></h1>
        <a class="sx-btn" href="/ext/prompt-sim/manager">🃏 <span data-i18n="sweep_axes.link_wildcard_manager">Wildcards</span></a>
        <a class="sx-btn" href="/ext/prompt-sim/">← <span data-i18n="sweep_axes.link_simulator">Sim</span></a>
      </div>

      <div class="sx-section">
        <h2 data-i18n="sweep_axes.dirs_heading">軸ディレクトリ</h2>
        <div id="sxDirList"></div>
        <div class="sx-dir-row">
          <button class="sx-btn" id="sxBrowseBtn" type="button">📂</button>
          <input class="sx-input" type="text" id="sxDirInput"
                 placeholder="/path/to/sweep_axes"
                 data-i18n-placeholder="sweep_axes.dir_path_placeholder">
          <button class="sx-btn primary" id="sxAddBtn" type="button" data-i18n="sweep_axes.btn_add">追加</button>
        </div>
        <div class="sx-hint" data-i18n="sweep_axes.dirs_hint">
          指定ディレクトリ配下の <code>.txt</code> ファイル（1 行 1 値・<code>#</code> コメント可）が
          Bridge Sweep の Prompt S/R で <code>__name__</code> 記法で参照可能になります。
        </div>
      </div>

      <div class="sx-section">
        <h2 data-i18n="sweep_axes.options_heading">オプション</h2>
        <label class="sx-toggle">
          <input type="checkbox" id="sxIncludeWildcards">
          <span data-i18n="sweep_axes.include_wildcards_label">Wildcard ディレクトリも参照する</span>
        </label>
        <div class="sx-hint" data-i18n="sweep_axes.include_wildcards_hint">
          ON にすると prompt-simulator の wildcard_dirs も Sweep 軸として読み込みます（同名は軸が優先）。
        </div>
      </div>

      <div class="sx-section">
        <h2>
          <span data-i18n="sweep_axes.preview_heading">検出された軸ファイル</span>
          <button class="sx-btn-sm" id="sxRefreshBtn" type="button" style="margin-left:8px;" data-i18n="sweep_axes.btn_refresh">🔄 更新</button>
        </h2>
        <div class="sx-tree-controls">
          <button class="sx-btn-sm" id="sxExpandAllBtn" type="button" data-i18n="sweep_axes.btn_expand_all">▾ 全展開</button>
          <button class="sx-btn-sm" id="sxCollapseAllBtn" type="button" data-i18n="sweep_axes.btn_collapse_all">▸ 全折畳</button>
        </div>
        <div class="sx-axis-list" id="sxAxisList">
          <div class="sx-empty" data-i18n="sweep_axes.loading">読み込み中…</div>
        </div>
      </div>
    </div>
  </main>

  <div class="sx-toast" id="sxToast" role="status" aria-live="polite"></div>

  <script nonce="{{ csp_nonce }}" src="/static/dir-picker-fallback.js"></script>
  <script nonce="{{ csp_nonce }}">
    "use strict";

    var _sxState = { axis_dirs: [], include_wildcard_dirs: false };

    function _sxClear(el) { while (el && el.firstChild) el.removeChild(el.firstChild); }

    function _sxToast(msg) {
      var t = document.getElementById('sxToast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(function() { t.classList.remove('show'); }, 2200);
    }

    function _sxRenderDirs(validation) {
      var list = document.getElementById('sxDirList');
      _sxClear(list);
      var dirs = _sxState.axis_dirs || [];
      if (dirs.length === 0) {
        var empty = document.createElement('div');
        empty.className = 'sx-empty';
        empty.textContent = 'ディレクトリ未設定';
        list.appendChild(empty);
        return;
      }
      var valMap = {};
      if (Array.isArray(validation)) validation.forEach(function(v) { valMap[v.path] = v.exists; });
      dirs.forEach(function(dir, idx) {
        var row = document.createElement('div');
        row.className = 'sx-dir-item';

        var code = document.createElement('code');
        code.title = dir;
        code.textContent = dir;
        row.appendChild(code);

        if (valMap[dir] !== undefined) {
          var stat = document.createElement('span');
          stat.className = valMap[dir] ? 'sx-validation-ok' : 'sx-validation-fail';
          stat.textContent = valMap[dir] ? '✓ exists' : '✗ not found';
          row.appendChild(stat);
        }

        var rmBtn = document.createElement('button');
        rmBtn.type = 'button';
        rmBtn.className = 'sx-btn-sm';
        rmBtn.title = 'remove';
        rmBtn.textContent = '✕';
        rmBtn.addEventListener('click', function() { _sxRemoveDir(idx); });
        row.appendChild(rmBtn);

        list.appendChild(row);
      });
    }

    // Group flat ``a/b/c`` names into a nested tree:
    //   { folders: { a: { folders: { b: ... }, leaves: [] } }, leaves: [{ name, full, src, count }] }
    function _sxBuildTree(names, axes, sources) {
      var root = { folders: {}, leaves: [] };
      names.forEach(function(full) {
        var parts = full.split('/');
        var leaf = parts.pop();
        var node = root;
        for (var i = 0; i < parts.length; i++) {
          var seg = parts[i];
          if (!node.folders[seg]) node.folders[seg] = { folders: {}, leaves: [] };
          node = node.folders[seg];
        }
        node.leaves.push({
          name: leaf,
          full: full,
          src: sources[full] || 'axis',
          count: (axes[full] || []).length,
        });
      });
      return root;
    }

    // Recursively count {files, totalLines} below a folder node — used for
    // the folder summary so the user can see weight without opening it.
    function _sxFolderStats(node) {
      var files = node.leaves.length;
      var lines = 0;
      node.leaves.forEach(function(l) { lines += l.count; });
      Object.keys(node.folders).forEach(function(k) {
        var s = _sxFolderStats(node.folders[k]);
        files += s.files;
        lines += s.lines;
      });
      return { files: files, lines: lines };
    }

    function _sxRenderLeaf(leaf) {
      var row = document.createElement('div');
      row.className = 'sx-axis-item';

      var badge = document.createElement('code');
      badge.className = 'sx-badge ' + (leaf.src === 'wildcard' ? 'wildcard' : 'axis');
      badge.textContent = leaf.src;
      row.appendChild(badge);

      var nm = document.createElement('span');
      nm.className = 'sx-axis-name';
      nm.textContent = '__' + leaf.full + '__';
      row.appendChild(nm);

      var cnt = document.createElement('span');
      cnt.className = 'sx-axis-count';
      cnt.textContent = String(leaf.count);
      row.appendChild(cnt);
      return row;
    }

    function _sxRenderTreeNode(node, container) {
      // Folders first (sorted), then leaves (sorted) — keeps grouped items
      // visually clustered above the bare files at this level.
      var folderNames = Object.keys(node.folders).sort();
      folderNames.forEach(function(fname) {
        var child = node.folders[fname];
        var stats = _sxFolderStats(child);
        var det = document.createElement('details');
        det.className = 'sx-tree-folder';
        det.open = true;
        var sm = document.createElement('summary');
        var nm = document.createElement('span');
        nm.className = 'sx-tree-folder-name';
        nm.textContent = '📁 ' + fname + '/';
        sm.appendChild(nm);
        var meta = document.createElement('span');
        meta.className = 'sx-tree-folder-meta';
        meta.textContent = stats.files + ' files / ' + stats.lines + ' lines';
        sm.appendChild(meta);
        det.appendChild(sm);
        var kids = document.createElement('div');
        kids.className = 'sx-tree-children';
        det.appendChild(kids);
        _sxRenderTreeNode(child, kids);
        container.appendChild(det);
      });
      var leaves = node.leaves.slice().sort(function(a, b) {
        return a.name < b.name ? -1 : (a.name > b.name ? 1 : 0);
      });
      leaves.forEach(function(leaf) { container.appendChild(_sxRenderLeaf(leaf)); });
    }

    function _sxRenderAxes(data) {
      var list = document.getElementById('sxAxisList');
      _sxClear(list);
      var axes = (data && data.axes) || {};
      var sources = (data && data.sources) || {};
      var names = Object.keys(axes).sort();
      if (names.length === 0) {
        var empty = document.createElement('div');
        empty.className = 'sx-empty';
        empty.textContent = '軸ファイルが見つかりません';
        list.appendChild(empty);
        return;
      }
      var tree = _sxBuildTree(names, axes, sources);
      _sxRenderTreeNode(tree, list);
    }

    function _sxSetAllFolders(open) {
      var list = document.getElementById('sxAxisList');
      var folders = list.querySelectorAll('details.sx-tree-folder');
      Array.prototype.forEach.call(folders, function(d) { d.open = open; });
    }

    function _sxFetchAxes() {
      return fetch('/ext/prompt-sim/sweep-axes', {
        credentials: 'same-origin',
        headers: { 'Accept': 'application/json', 'X-Requested-With': 'XMLHttpRequest' }
      })
        .then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function(data) {
          _sxState.axis_dirs = data.axis_dirs || [];
          _sxState.include_wildcard_dirs = !!data.include_wildcard_dirs;
          document.getElementById('sxIncludeWildcards').checked = _sxState.include_wildcard_dirs;
          _sxRenderDirs(null);
          _sxRenderAxes(data);
          if (window._sweepAxesCache !== undefined) {
            window._sweepAxesCache = data.axes || {};
            window._sweepAxesPromise = null;
          }
        });
    }

    function _sxSaveConfig(updates) {
      return fetch('/ext/prompt-sim/sweep-axis-config', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
        body: JSON.stringify(updates)
      })
        .then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function(data) {
          _sxState.axis_dirs = data.axis_dirs || [];
          _sxState.include_wildcard_dirs = !!data.include_wildcard_dirs;
          _sxRenderDirs(data.validation);
          return _sxFetchAxes();
        });
    }

    function _sxAddDir() {
      var input = document.getElementById('sxDirInput');
      var val = (input.value || '').trim();
      if (!val) return;
      var dirs = _sxState.axis_dirs.slice();
      if (dirs.indexOf(val) === -1) dirs.push(val);
      input.value = '';
      _sxSaveConfig({ axis_dirs: dirs }).catch(function() { _sxToast('保存に失敗'); });
    }

    function _sxRemoveDir(idx) {
      var dirs = _sxState.axis_dirs.slice();
      dirs.splice(idx, 1);
      _sxSaveConfig({ axis_dirs: dirs }).catch(function() { _sxToast('保存に失敗'); });
    }

    function _sxBrowse() {
      var input = document.getElementById('sxDirInput');
      var current = (input.value || '').trim();
      fetch('/api/tools/select-folder' + (current ? '?initial=' + encodeURIComponent(current) : ''))
        .then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function(data) {
          if (data && data.path) { input.value = data.path; return; }
          if (data && data.cancelled) return; // user backed out of the native dialog
          window.dirPickerFallback(current, function(path) { input.value = path; });
        })
        .catch(function() {
          window.dirPickerFallback(current, function(path) { input.value = path; });
        });
    }

    function _sxInit() {
      document.getElementById('sxAddBtn').addEventListener('click', _sxAddDir);
      document.getElementById('sxBrowseBtn').addEventListener('click', _sxBrowse);
      document.getElementById('sxRefreshBtn').addEventListener('click', function() {
        _sxFetchAxes().catch(function() { _sxToast('読み込みに失敗'); });
      });
      document.getElementById('sxExpandAllBtn').addEventListener('click', function() {
        _sxSetAllFolders(true);
      });
      document.getElementById('sxCollapseAllBtn').addEventListener('click', function() {
        _sxSetAllFolders(false);
      });
      document.getElementById('sxDirInput').addEventListener('keydown', function(ev) {
        if (ev.key === 'Enter') { ev.preventDefault(); _sxAddDir(); }
      });
      document.getElementById('sxIncludeWildcards').addEventListener('change', function(ev) {
        _sxSaveConfig({ include_wildcard_dirs: !!ev.target.checked })
          .catch(function() { _sxToast('保存に失敗'); });
      });
      _sxFetchAxes().catch(function() { _sxToast('初期読み込みに失敗'); });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', _sxInit);
    } else {
      _sxInit();
    }
  </script>
</body>
</html>
