function _wmt(key, fallback) {
  var dict = _wmI18n[_wmLang] || _wmI18n.en;
  return dict[key] || (_wmI18n.en[key]) || fallback || key;
}

/* Apply i18n to DOM */
(function() {
  document.querySelectorAll('[data-wm-i18n]').forEach(function(el) {
    var text = _wmt(el.getAttribute('data-wm-i18n'));
    if (text) el.textContent = text;
  });
  document.querySelectorAll('[data-wm-i18n-attr]').forEach(function(el) {
    var parts = el.getAttribute('data-wm-i18n-attr').split(':');
    if (parts.length === 2) {
      var text = _wmt(parts[1]);
      if (text) el.setAttribute(parts[0], text);
    }
  });
  document.documentElement.setAttribute('lang', _wmLang);
})();

/* ── State ── */
var _wmWildcards = {};
var _wmSources = {};    /* {name: "txt"|"yaml"} — origin format per entry */
var _wmSelectedWc = null;
var _wmDirOpen = {};
var _wmDirs = [];
var _wmEditor = null;
var _wmDirty = false;   /* true when editor has unsaved changes */

function _wmIsYaml(name) { return _wmSources[name] === 'yaml'; }

/* Update dirty indicator (asterisk) in editor header */
function _wmUpdateDirtyIndicator() {
  var el = document.getElementById('wmEditorName');
  if (!el || !_wmSelectedWc) return;
  var base = '__' + _wmSelectedWc + '__';
  el.textContent = _wmDirty ? base + ' *' : base;
}

/* ── Utility ── */
function _wmEscHtml(s) {
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}
function _wmEscAttr(s) {
  return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ── Editor init (PromptSyntaxWidget + Vim/Emacs) ── */
(function initWmEditor() {
  var container = document.getElementById('wmEditorContainer');
  if (!container) return;
  if (typeof PromptSyntaxWidget !== 'undefined') {
    _wmEditor = PromptSyntaxWidget.createEditor(container, {
      value: '',
      placeholder: '',
      rows: 20,
      showSyntaxBar: false,
      showErrors: false,
    });
  } else {
    var ta = document.createElement('textarea');
    ta.id = 'wmEditorTextarea';
    ta.setAttribute('aria-label', 'Wildcard editor');
    ta.style.cssText = 'width:100%;min-height:400px;padding:10px;border-radius:8px;border:1px solid rgba(128,128,128,0.2);background:rgba(30,30,50,0.8);color:var(--text,#e0e0e0);font-family:monospace;font-size:13px;resize:vertical;line-height:1.5;';
    container.appendChild(ta);
  }
  /* Vim / Emacs keybindings — resolve keyboardPowerVimEdit lazily (module loads after inline) */
  (function() {
    var ta = _wmEditor ? _wmEditor.getTextarea() : document.getElementById('wmEditorTextarea');
    if (!ta) return;
    ta.addEventListener('keydown', function(e) {
      var edit = window.keyboardPowerVimEdit;
      if (!edit) return;
      if (e.altKey && !e.ctrlKey && !e.shiftKey) edit.handleVimNavigation(e, ta);
      if (e.ctrlKey && !e.altKey) edit.handleCtrlShortcuts(e, ta);
    });
  })();

  /* ── Line number gutter ── */
  (function initGutter() {
    var editorWrap = _wmEditor
      ? container.querySelector('.ps-editor-wrap') || container.querySelector('.ps-editor-container')
      : container.querySelector('textarea');
    if (!editorWrap) return;

    var lined = document.createElement('div');
    lined.className = 'wm-editor-lined';
    var gutter = document.createElement('div');
    gutter.className = 'wm-line-gutter';
    gutter.id = 'wmLineGutter';

    /* Wrap existing content in lined container */
    var parent = editorWrap.parentNode;
    parent.insertBefore(lined, editorWrap);
    lined.appendChild(gutter);
    lined.appendChild(editorWrap);

    var ta = _wmEditor ? _wmEditor.getTextarea() : editorWrap;
    window._wmGutter = gutter;

    /* (C) Wrap-aware gutter: measure each line's visual height via a hidden
     *     mirror div, then create one <div> per line number with matching
     *     height so numbers stay aligned even when long lines wrap.        */
    var _wmGutterCache = { count: 0, width: 0, len: 0 };
    var _wmGutterRetried = false;

    var _WM_GUTTER_FAST_THRESHOLD = 300; /* lines — above this use fast path */

    window._wmUpdateGutter = function() {
      var taWidth = ta.clientWidth;
      if (taWidth === 0) {
        /* Editor not visible yet — defer once to next frame */
        if (!_wmGutterRetried) {
          _wmGutterRetried = true;
          requestAnimationFrame(window._wmUpdateGutter);
        }
        return;
      }
      _wmGutterRetried = false;

      var text = ta.value || '';
      var lines = text.split('\n');
      var count = lines.length;
      var textLen = text.length;
      if (count === _wmGutterCache.count
          && taWidth === _wmGutterCache.width
          && textLen === _wmGutterCache.len) return;
      _wmGutterCache.count = count;
      _wmGutterCache.width = taWidth;
      _wmGutterCache.len = textLen;

      /* Fast path for large files: skip per-line mirror measurement,
         use CSS line-height for uniform height. Much faster for 300+ lines. */
      if (count > _WM_GUTTER_FAST_THRESHOLD) {
        var gFrag = document.createDocumentFragment();
        for (var i = 0; i < count; i++) {
          var nd = document.createElement('div');
          nd.textContent = i + 1;
          gFrag.appendChild(nd);
        }
        gutter.innerHTML = '';
        gutter.appendChild(gFrag);
        return;
      }

      /* Create hidden mirror div once */
      if (!window._wmGutterMirror) {
        var m = document.createElement('div');
        m.style.cssText = 'position:absolute;top:-9999px;left:-9999px;visibility:hidden;'
          + 'white-space:pre-wrap;word-wrap:break-word;overflow-wrap:break-word;box-sizing:border-box;';
        document.body.appendChild(m);
        window._wmGutterMirror = m;
      }

      /* Sync mirror styles with textarea */
      var mirror = window._wmGutterMirror;
      var cs = getComputedStyle(ta);
      mirror.style.fontFamily = cs.fontFamily;
      mirror.style.fontSize = cs.fontSize;
      mirror.style.lineHeight = cs.lineHeight;
      mirror.style.width = taWidth + 'px';
      mirror.style.paddingLeft = cs.paddingLeft;
      mirror.style.paddingRight = cs.paddingRight;

      /* Insert one <div> per line into mirror for height measurement */
      mirror.innerHTML = '';
      var mFrag = document.createDocumentFragment();
      for (var i = 0; i < count; i++) {
        var ld = document.createElement('div');
        ld.textContent = lines[i] || '\u00a0';
        mFrag.appendChild(ld);
      }
      mirror.appendChild(mFrag);

      /* Read measured heights, build gutter divs */
      var gFrag = document.createDocumentFragment();
      var mc = mirror.children;
      for (var i = 0; i < count; i++) {
        var nd = document.createElement('div');
        nd.textContent = i + 1;
        nd.style.height = mc[i].offsetHeight + 'px';
        gFrag.appendChild(nd);
      }
      gutter.innerHTML = '';
      gutter.appendChild(gFrag);
      mirror.innerHTML = '';
    };

    /* (E) Optimised with lastIndexOf chain — avoids substring + split allocations */
    window._wmUpdateLineInfo = function() {
      var el = document.getElementById('wmLineInfo');
      if (!el) return;
      var pos = ta.selectionStart || 0;
      var val = ta.value;
      var lastNl = val.lastIndexOf('\n', pos - 1);
      var col = pos - lastNl; /* 1-based; works correctly when lastNl == -1 */
      var line = 1, idx = lastNl;
      while (idx !== -1) { idx = val.lastIndexOf('\n', idx - 1); line++; }
      el.textContent = _wmt('line_col').replace('{0}', line).replace('{1}', col);
    };

    /* (D) Debounce timers — longer delay for large files */
    var _wmGutterTimer = null, _wmLineInfoTimer = null;
    function _wmScheduleGutter() {
      clearTimeout(_wmGutterTimer);
      var delay = (ta.value.length > 20000) ? 250 : 50;
      _wmGutterTimer = setTimeout(_wmUpdateGutter, delay);
    }
    function _wmScheduleLineInfo() {
      clearTimeout(_wmLineInfoTimer);
      var delay = (ta.value.length > 20000) ? 250 : 50;
      _wmLineInfoTimer = setTimeout(_wmUpdateLineInfo, delay);
    }

    ta.addEventListener('input', function() { _wmDirty = true; _wmUpdateDirtyIndicator(); _wmScheduleGutter(); _wmScheduleLineInfo(); });
    ta.addEventListener('scroll', function() { gutter.scrollTop = ta.scrollTop; });
    ta.addEventListener('click', _wmUpdateLineInfo);
    ta.addEventListener('keyup', _wmScheduleLineInfo);

    /* Re-measure gutter when textarea width changes (window resize etc.) */
    if (typeof ResizeObserver !== 'undefined') {
      new ResizeObserver(_wmScheduleGutter).observe(ta);
    }

    _wmUpdateGutter();
    _wmUpdateLineInfo();
  })();
})();
