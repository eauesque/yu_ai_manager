<style>
/* ── Hailo Chat Layout (hc- prefix) ────────────────────────── */
.hc-app{display:flex;height:100vh;overflow:hidden;padding-top:var(--nav-h,50px);}

/* Sidebar */
.hc-sidebar{width:260px;min-width:260px;background:var(--bg-secondary,#f0f0f0);border-right:1px solid var(--border,#ddd);display:flex;flex-direction:column;overflow:hidden;transition:transform .2s;}
body.dark .hc-sidebar{background:var(--bg-secondary,#1a1a2e);border-right-color:var(--border,#333);}
.hc-sidebar-header{padding:12px;border-bottom:1px solid var(--border,rgba(128,128,128,.2));}
.hc-new-btn{width:100%;font-size:13px!important;padding:8px!important;border-radius:6px!important;}
.hc-conv-list{flex:1;overflow-y:auto;padding:8px;}
.hc-sidebar-footer{padding:10px 12px;border-top:1px solid var(--border,rgba(128,128,128,.2));font-size:12px;}
.hc-back-link{color:var(--accent,#667eea);text-decoration:none;}
.hc-back-link:hover{text-decoration:underline;}

/* Conversation items */
.hc-conv-item{padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;transition:background .15s;}
.hc-conv-item:hover{background:rgba(128,128,128,.12);}
.hc-conv-item.hc-active{background:var(--accent,#667eea);color:#fff;}
.hc-conv-item .hc-conv-title{display:block;overflow:hidden;text-overflow:ellipsis;}
.hc-conv-item .hc-conv-meta{font-size:10px;opacity:.6;margin-top:2px;}

/* Sidebar toggle */
.hc-sidebar-toggle{display:none;position:fixed;top:calc(var(--nav-h,50px) + 8px);left:8px;z-index:20;background:var(--bg-secondary,#f0f0f0);border:1px solid var(--border,#ddd);border-radius:6px;padding:6px 10px;font-size:16px;cursor:pointer;color:var(--text,#333);}
body.dark .hc-sidebar-toggle{background:var(--bg-secondary,#1a1a2e);border-color:var(--border,#333);color:var(--text,#eee);}

/* Main area */
.hc-main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;}

/* Welcome */
.hc-welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--text,#333);}
body.dark .hc-welcome{color:var(--text,#eee);}
.hc-welcome-icon{font-size:48px;margin-bottom:12px;}
.hc-welcome h2{margin:0 0 8px;font-size:20px;}
.hc-welcome p{margin:0 0 16px;font-size:13px;color:var(--muted,#aab2c0);max-width:400px;}
.hc-model-select-wrap{display:flex;align-items:center;gap:8px;font-size:13px;}
.hc-select{padding:4px 8px;border-radius:4px;border:1px solid var(--border,#555);background:var(--bg-secondary,#f8f8f8);color:var(--text,#333);font-size:13px;}
body.dark .hc-select{background:var(--bg-secondary,#2a2a2a);color:var(--text,#eee);}

/* Messages area */
.hc-messages{flex:1;overflow-y:auto;padding:16px 24px;display:flex;flex-direction:column;gap:16px;}

/* Message bubbles */
.hc-msg{max-width:75%;font-size:14px;line-height:1.6;}
.hc-msg-user{align-self:flex-end;}
.hc-msg-ai{align-self:flex-start;}
.hc-msg-label{font-size:10px;font-weight:700;opacity:.5;margin-bottom:3px;}
.hc-msg-user .hc-msg-label{text-align:right;}
.hc-msg-body{padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-break:break-word;}
.hc-msg-user .hc-msg-body{background:var(--accent,#667eea);color:#fff;border-bottom-right-radius:4px;}
.hc-msg-ai .hc-msg-body{background:rgba(128,128,128,.12);color:var(--text,#333);border-bottom-left-radius:4px;}
body.dark .hc-msg-ai .hc-msg-body{color:var(--text,#eee);}

/* Typing indicator */
.hc-typing{display:inline-flex;gap:4px;padding:10px 14px;}
.hc-typing span{width:6px;height:6px;border-radius:50%;background:var(--muted,#aab2c0);animation:hcBounce .6s infinite alternate;}
.hc-typing span:nth-child(2){animation-delay:.2s;}
.hc-typing span:nth-child(3){animation-delay:.4s;}
@keyframes hcBounce{to{opacity:.3;transform:translateY(-4px);}}

/* Input area */
.hc-input-area{padding:12px 24px 16px;border-top:1px solid var(--border,rgba(128,128,128,.15));}
.hc-input-row{display:flex;gap:8px;align-items:flex-end;}

/* Tool buttons (web search etc.) */
.hc-tool-btn{width:38px;height:38px;border-radius:8px;border:1.5px solid #999;background:#e8e8ec;color:#333;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;}
.hc-tool-btn svg{width:20px;height:20px;flex-shrink:0;pointer-events:none;}
body.dark .hc-tool-btn{background:#2a2a3a;color:#bbb;border-color:#666;}
.hc-tool-btn:hover{color:#111;border-color:var(--accent,#667eea);background:rgba(102,126,234,.1);}
body.dark .hc-tool-btn:hover{color:#fff;border-color:var(--accent,#667eea);background:rgba(102,126,234,.15);}
.hc-tool-btn.hc-active{background:#667eea!important;color:#fff!important;border-color:#667eea!important;box-shadow:0 0 0 2px rgba(102,126,234,.3)!important;}

/* Search results card */
.hc-search-card{font-size:12px;background:rgba(128,128,128,.06);border:1px solid var(--border,rgba(128,128,128,.15));border-radius:8px;padding:8px 10px;margin-bottom:4px;}
.hc-search-card-title{font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px;color:var(--muted,#aab2c0);}
.hc-search-card-title svg{flex-shrink:0;}

/* Agent tool steps */
.hc-agent-steps{font-size:11px;background:rgba(102,126,234,.06);border:1px solid rgba(102,126,234,.2);border-radius:8px;padding:8px 10px;margin-bottom:4px;}
.hc-agent-steps-title{font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px;color:var(--accent,#667eea);font-size:12px;}
.hc-agent-step{padding:3px 0;border-bottom:1px solid rgba(128,128,128,.08);display:flex;align-items:baseline;gap:6px;}
.hc-agent-step:last-child{border-bottom:none;}
.hc-agent-step-name{font-weight:600;color:var(--accent,#667eea);white-space:nowrap;}
.hc-agent-step-args{color:var(--muted,#aab2c0);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:300px;}
.hc-search-item{margin:3px 0;line-height:1.4;}
.hc-search-item a{color:var(--accent,#667eea);text-decoration:none;font-weight:500;}
.hc-search-item a:hover{text-decoration:underline;}
.hc-search-item .hc-snippet{color:var(--muted,#aab2c0);display:block;font-size:11px;}

/* Image preview (above input) */
.hc-img-preview{display:flex;align-items:center;gap:8px;padding:6px 8px;margin-bottom:6px;background:rgba(128,128,128,.08);border:1px solid var(--border,rgba(128,128,128,.2));border-radius:8px;}
.hc-img-preview img{width:48px;height:48px;object-fit:cover;border-radius:6px;}
.hc-img-remove{background:none;border:none;color:var(--error,#e53935);font-size:18px;cursor:pointer;padding:2px 6px;line-height:1;}
.hc-img-label{font-size:10px;font-weight:700;color:var(--accent,#667eea);background:rgba(102,126,234,.12);padding:2px 6px;border-radius:4px;}

/* Image in message bubble */
.hc-msg-img{max-width:200px;max-height:200px;border-radius:8px;margin-bottom:6px;display:block;}

.hc-textarea{flex:1;padding:10px 14px;border-radius:10px;border:1px solid var(--border,#555);background:var(--bg-secondary,#f8f8f8);color:var(--text,#333);font-size:14px;font-family:inherit;resize:none;max-height:120px;line-height:1.4;}
body.dark .hc-textarea{background:var(--bg-secondary,#2a2a2a);color:var(--text,#eee);}
.hc-textarea:focus{outline:none;border-color:var(--accent,#667eea);}
.hc-send-btn{width:40px;height:40px;border-radius:50%!important;padding:0!important;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hc-send-btn:disabled{opacity:.4;cursor:not-allowed;}
.hc-input-info{display:flex;justify-content:space-between;align-items:center;font-size:11px;margin-top:4px;padding:0 4px;}
.hc-muted{color:var(--muted,#aab2c0);}
.hc-model-switch{font-size:11px;padding:1px 4px;border-radius:4px;border:1px solid #bbb;background:#f5f5f5;color:#555;cursor:pointer;max-width:180px;text-overflow:ellipsis;}
body.dark .hc-model-switch{background:#2a2a3a;color:#aaa;border-color:#555;}

/* Context menu */
.hc-ctx-menu{position:fixed;z-index:100;background:var(--bg,#fff);border:1px solid var(--border,#ddd);border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.15);overflow:hidden;min-width:120px;}
body.dark .hc-ctx-menu{background:var(--bg,#1e1e1e);border-color:var(--border,#444);}
.hc-ctx-item{display:block;width:100%;padding:8px 14px;border:none;background:none;text-align:left;font-size:13px;cursor:pointer;color:var(--text,#333);}
body.dark .hc-ctx-item{color:var(--text,#eee);}
.hc-ctx-item:hover{background:rgba(128,128,128,.12);}
.hc-ctx-danger{color:var(--error,#e53935)!important;}

/* Mobile responsive */
@media(max-width:700px){
  .hc-sidebar{position:fixed;top:var(--nav-h,50px);left:0;bottom:0;z-index:30;transform:translateX(-100%);}
  .hc-sidebar.hc-open{transform:translateX(0);}
  .hc-sidebar-toggle{display:block;}
  .hc-messages{padding:12px 12px;}
  .hc-input-area{padding:8px 12px 12px;}
  .hc-msg{max-width:90%;}
}
</style>
