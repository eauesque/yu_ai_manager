<div class="pl-modal-overlay hidden" id="plFolderModalOverlay">
  <div class="pl-modal" style="width:360px;">
    <h3 id="plFolderModalTitle" data-i18n="prompt_library.new_folder">New Folder</h3>
    <input type="hidden" id="plFolderEditId" value="">
    <label for="plFolderName" data-i18n="prompt_library.label_name">Name</label>
    <input type="text" id="plFolderName" placeholder="Folder name" data-i18n-placeholder="prompt_library.folder_name_placeholder">
    <div class="pl-modal-actions">
      <button class="pl-btn" id="plFolderModalCancel" data-i18n="prompt_library.cancel">Cancel</button>
      <button class="pl-btn primary" id="plFolderModalSave" data-i18n="prompt_library.create">Create</button>
    </div>
  </div>
</div>

<div class="pl-modal-overlay hidden" id="plTagModalOverlay">
  <div class="pl-modal" style="width:360px;">
    <h3 data-i18n="prompt_library.new_tag">New Tag</h3>
    <label for="plTagName" data-i18n="prompt_library.label_name">Name</label>
    <input type="text" id="plTagName" placeholder="Tag name" data-i18n-placeholder="prompt_library.tag_name_placeholder">
    <div class="pl-modal-actions">
      <button class="pl-btn" id="plTagModalCancel" data-i18n="prompt_library.cancel">Cancel</button>
      <button class="pl-btn primary" id="plTagModalSave" data-i18n="prompt_library.create">Create</button>
    </div>
  </div>
</div>
