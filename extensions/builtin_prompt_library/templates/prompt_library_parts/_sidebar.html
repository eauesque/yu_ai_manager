<div class="pl-sidebar" id="plSidebar">
  <div class="pl-sidebar-section">
    <div class="pl-sidebar-header">
      <span data-i18n="prompt_library.folders">Folders</span>
      <button class="pl-sidebar-add" id="plAddFolder" title="New folder" data-i18n-title="prompt_library.new_folder" aria-label="New folder" data-i18n-aria-label="prompt_library.new_folder">+</button>
    </div>
    <div class="pl-folder-list" id="plFolderList">
      <div class="pl-folder-item active" data-folder-id="">
        <span class="pl-folder-name" data-i18n="prompt_library.all">All</span>
        <span class="pl-folder-count" id="plAllCount">0</span>
      </div>
    </div>
  </div>
  <div class="pl-sidebar-section">
    <div class="pl-sidebar-header">
      <span data-i18n="prompt_library.tags">Tags</span>
      <button class="pl-sidebar-add" id="plAddTag" title="New tag" data-i18n-title="prompt_library.new_tag" aria-label="New tag" data-i18n-aria-label="prompt_library.new_tag">+</button>
    </div>
    <div class="pl-tag-list" id="plTagList"></div>
  </div>
</div>
