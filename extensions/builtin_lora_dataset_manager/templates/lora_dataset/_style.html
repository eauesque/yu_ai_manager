<style>

.ldm-layout {
  display: flex;
  gap: 16px;
  padding: 16px;

}

  width: 260px;
  flex-shrink: 0;
  background: var(--bg-card);

  border: 1px solid var(--border);
  padding: 12px;
  overflow-y: auto;

}

  font-size: 13px;
  color: var(--muted);

  text-transform: uppercase;

}
.ldm-project-item {
  display: flex;
  align-items: center;
  padding: 8px 10px;
  border-radius: 6px;

  font-size: 13px;

}
.ldm-project-item:hover { background: var(--bg-input); }
.ldm-project-item.active { background: var(--accent-bg, rgba(102,126,234,0.15)); color: var(--accent, #667eea); font-weight: 600; }
.ldm-project-item .ldm-count {
  margin-left: auto;
  font-size: 11px;
  color: var(--muted);
  background: var(--bg-input);
  padding: 1px 6px;
  border-radius: 8px;
}
.ldm-new-btn {
  width: 100%;
  padding: 8px;
  margin-top: 8px;
  border: 1px dashed var(--border);
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 12px;
}
.ldm-new-btn:hover { border-color: var(--accent, #667eea); color: var(--accent, #667eea); }

  flex: 1;
  min-width: 0;
}

  align-items: center;
  justify-content: center;
  height: 300px;
  color: var(--muted);
  font-size: 14px;
}

  border-bottom: 1px solid var(--border);

}

}

.ldm-tab-panel.active { display: block; }

  font-size: 12px;
  cursor: pointer;

.ldm-tag-chip:hover { background: var(--bg-card); }

}

  .ldm-layout { flex-direction: column; }
